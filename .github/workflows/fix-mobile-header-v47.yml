name: Fix mobile header v47

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-mobile-header-v47.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch mobile header and force fresh CSS
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          idx = Path('index.html')
          s = idx.read_text(encoding='utf-8')

          # Paksa browser mengambil stylesheet terbaru.
          s = s.replace('ui-v9.css?v=45', 'ui-v9.css?v=47')
          s = s.replace('ui-v9.css?v=46', 'ui-v9.css?v=47')

          marker = '/* MOBILE HEADER PORTRAIT V47 FINAL */'
          css = r'''

/* MOBILE HEADER PORTRAIT V47 FINAL */
@media(max-width:680px) and (orientation:portrait){
  .topBar{
    display:grid!important;
    grid-template-columns:auto minmax(0,1fr)!important;
    align-items:center!important;
    gap:8px!important;
    flex-wrap:nowrap!important;
  }
  .topLogos{
    display:flex!important;
    flex-direction:row!important;
    align-items:center!important;
    justify-content:center!important;
    gap:5px!important;
    min-height:0!important;
    overflow:visible!important;
  }
  .logoFrame{
    width:56px!important;
    height:56px!important;
    min-width:56px!important;
    min-height:56px!important;
    padding:5px!important;
    border-radius:10px!important;
  }
  .logoFrame img{
    display:block!important;
    width:46px!important;
    height:46px!important;
    max-width:46px!important;
    max-height:46px!important;
    object-fit:contain!important;
    object-position:center!important;
  }
  .topText{
    min-width:0!important;
    width:auto!important;
  }
  .topText h1{
    margin:0!important;
    font-size:13px!important;
    line-height:1.25!important;
    text-align:left!important;
  }
  .topText p{
    margin:5px 0 0!important;
    width:100%!important;
    max-width:none!important;
    font-size:9.5px!important;
    line-height:1.5!important;
    text-align:justify!important;
    text-align-last:left!important;
    text-justify:inter-word!important;
    hyphens:auto!important;
    overflow-wrap:break-word!important;
  }
}
@media(max-width:360px) and (orientation:portrait){
  .topBar{gap:6px!important}
  .topLogos{gap:4px!important}
  .logoFrame{width:50px!important;height:50px!important;min-width:50px!important;min-height:50px!important;padding:4px!important}
  .logoFrame img{width:42px!important;height:42px!important;max-width:42px!important;max-height:42px!important}
  .topText h1{font-size:12px!important}
  .topText p{font-size:9px!important;line-height:1.45!important}
}
'''

          if marker not in s:
              pos = s.find('</style>')
              if pos < 0:
                  raise SystemExit('Tag </style> tidak ditemukan')
              s = s[:pos] + css + s[pos:]

          idx.write_text(s, encoding='utf-8')
          PY

          grep -q 'ui-v9.css?v=47' index.html
          grep -q 'MOBILE HEADER PORTRAIT V47 FINAL' index.html

          rm -f .github/workflows/fix-mobile-header-v47.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/fix-mobile-header-v47.yml
          git commit -m 'Perbaiki final header mobile portrait dan cache CSS'
          git push
