name: Restore content password origin

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-content-password-origin.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore original content-manager password behavior
        shell: bash
        run: |
          set -euo pipefail

          # Ambil content manager dari keadaan stabil sebelum eksperimen password terbaru.
          # Mekanisme login di file ini masih mekanisme awal: prompt -> contentAdminLogin.
          git show 201562a755b96e7d5c36eeec79060550a27f68e6:js/content-manager-v1.js > js/content-manager-v1.js

          python - <<'PY'
          from pathlib import Path

          # Hapus seluruh lapisan popup/mask password tambahan; kembali ke prompt bawaan CMS.
          p = Path('js/drive-image-fix-v2.js')
          s = p.read_text(encoding='utf-8')
          marker = "\n(()=>{\n  if(document.querySelector('script[data-pn-cms-password-mask]'))return;"
          if marker in s:
              s = s.split(marker, 1)[0].rstrip() + "\n"
          p.write_text(s, encoding='utf-8')

          # Hapus modul password tambahan bila masih ada.
          mask = Path('js/content-password-mask-v1.js')
          if mask.exists():
              mask.unlink()

          # Cache busting saja; isi content-manager tetap mekanisme awal.
          idx = Path('index.html')
          x = idx.read_text(encoding='utf-8')
          import re
          x = re.sub(r'js/content-manager-v1\.js\?v=\d+', 'js/content-manager-v1.js?v=5', x, count=1)
          x = re.sub(r'js/drive-image-fix-v2\.js\?v=\d+', 'js/drive-image-fix-v2.js?v=5', x, count=1)
          idx.write_text(x, encoding='utf-8')
          PY

          node --check js/content-manager-v1.js
          node --check js/drive-image-fix-v2.js
          grep -q "window.prompt('Masukkan password admin untuk mengaktifkan pengelola konten:'" js/content-manager-v1.js
          grep -q "postReliable('contentAdminLogin'" js/content-manager-v1.js
          if grep -q 'content-password-mask-v1.js' js/drive-image-fix-v2.js; then
            echo 'Password mask masih dipanggil' >&2
            exit 1
          fi

          rm -f .github/workflows/restore-content-password-origin.yml
          rm -f .github/workflows/check-content-backend-now.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Kembalikan password pengelola konten ke mekanisme awal'
          git push
