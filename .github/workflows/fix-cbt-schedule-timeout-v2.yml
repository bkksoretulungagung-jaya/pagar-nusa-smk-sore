name: Fix CBT schedule timeout v2

on:
  push:
    branches: [main]
    paths:
      - 'tools/fix_cbt_schedule_timeout_v2.py'
      - '.github/workflows/fix-cbt-schedule-timeout-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply CBT schedule timeout fix
        run: python tools/fix_cbt_schedule_timeout_v2.py
      - name: Commit installation
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/Code.gs jadwal-cbt.html
          git commit -m "Perbaiki timeout simpan jadwal CBT"
          git push
