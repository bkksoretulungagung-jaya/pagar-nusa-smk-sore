name: Fix CMS password mask final

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-cms-password-mask-final.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace native prompt with password field
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64,re
          p=Path('js/content-manager-v1.js')
          s=p.read_text(encoding='utf-8')
          marker="async function connectContent(){"
          old="  const password=window.prompt('Masukkan password admin untuk mengaktifkan pengelola konten:','');if(password===null)return false;"
          if old not in s:
              raise SystemExit('Prompt password lama tidak ditemukan')
          helper=base64.b64decode('').decode('utf-8')
          s=s.replace(marker,helper+marker,1)
          s=s.replace(old,"  const password=await askContentPassword();if(password===null)return false;",1)
          p.write_text(s,encoding='utf-8')
          idx=Path('index.html')
          t=idx.read_text(encoding='utf-8')
          t,n=re.subn(r'js/content-manager-v1\.js\?v=\d+','js/content-manager-v1.js?v=7',t,count=1)
          if n!=1:
              raise SystemExit('Loader content-manager tidak ditemukan')
          idx.write_text(t,encoding='utf-8')
          PY
          node --check js/content-manager-v1.js
          grep -q 'type="password"' js/content-manager-v1.js
          grep -q 'await askContentPassword()' js/content-manager-v1.js
          grep -q 'content-manager-v1.js?v=7' index.html
          rm -f .github/workflows/fix-cms-password-mask-final.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/content-manager-v1.js index.html .github/workflows/fix-cms-password-mask-final.yml
          git commit -m 'Sembunyikan karakter password pengelola konten'
          git push
