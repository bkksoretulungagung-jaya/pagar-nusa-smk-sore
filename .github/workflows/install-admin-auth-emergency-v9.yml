name: Install admin auth emergency v9

on:
  push:
    branches: [main]
    paths:
      - 'js/admin-auth-emergency-v9.js'
      - 'tools/install_admin_auth_emergency_v9.py'
      - '.github/workflows/install-admin-auth-emergency-v9.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check emergency auth syntax
        run: node --check js/admin-auth-emergency-v9.js
      - name: Install emergency auth as final script
        run: python tools/install_admin_auth_emergency_v9.py
      - name: Commit installed index
        run: |
          if git diff --quiet -- index.html; then
            echo 'No index changes needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Pasang handler darurat login admin v9'
          git push
