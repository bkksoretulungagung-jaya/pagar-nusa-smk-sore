name: Sync portal Riwayat UKT v1

on:
  push:
    branches: [main]
    paths:
      - 'tools/sync_ukt_portal_v1.py'
      - '.github/workflows/sync-ukt-portal-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pasang portal UKT 1-6
        run: python tools/sync_ukt_portal_v1.py
      - name: Validasi hasil
        run: |
          grep -q 'id="uktCard"' biodata.html
          grep -q 'BELUM MENGIKUTI' biodata.html
          grep -q "PN_UKT_SHEET_NAME = 'Riwayat UKT'" backend/Biodata.gs
          grep -q 'getStudentUktHistory_' backend/Biodata.gs
          git diff --check
      - name: Commit hasil sinkronisasi
        run: |
          if git diff --quiet -- biodata.html backend/Biodata.gs; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add biodata.html backend/Biodata.gs
          git commit -m "Tambahkan portal Riwayat UKT 1-6"
          git push
