name: Install dashboard persist v1
on:
  push:
    paths:
      - 'js/dashboard-persist-v1.js'
      - 'tools/install_dashboard_persist_v1.py'
      - '.github/workflows/install-dashboard-persist-v1.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pasang snapshot dashboard persisten
        run: python3 tools/install_dashboard_persist_v1.py
      - name: Commit pemasangan dashboard persisten
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Aktifkan dashboard persisten dari snapshot database terakhir"
            git push
          fi
