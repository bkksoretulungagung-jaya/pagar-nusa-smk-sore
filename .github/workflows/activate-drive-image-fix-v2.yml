name: Activate Drive image fix v2

on:
  push:
    branches: [main]
    paths:
      - 'js/drive-image-fix-v2.js'
      - 'tools/activate_drive_image_fix_v2.py'
      - '.github/workflows/activate-drive-image-fix-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Activate Drive image fix
        run: python tools/activate_drive_image_fix_v2.py
      - name: Commit activation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Aktifkan perbaikan gambar Google Drive v2"
            git push
          fi
