name: Install materi pengurus v1

on:
  push:
    branches: [main]
    paths:
      - 'materi-pengurus.html'
      - 'tools/install_materi_pengurus_v1.py'
      - '.github/workflows/install-materi-pengurus-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install materi pengurus
        run: python tools/install_materi_pengurus_v1.py
      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/Code.gs index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Aktifkan materi khusus pengurus"
            git push
          fi
