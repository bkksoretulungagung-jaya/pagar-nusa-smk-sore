name: Fix CMS transport v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-cms-transport-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply stable hybrid transport
        shell: bash
        run: |
          set -euo pipefail
          python -c "import base64;exec(base64.b64decode(''))"
          node --check js/content-manager-v1.js
          grep -q "window.addEventListener('message',onMessage)" js/content-manager-v1.js
          grep -q "contentResult" js/content-manager-v1.js
          grep -q "content-manager-v1.js?v=6" index.html
          rm -f .github/workflows/fix-content-server-connection-final.yml .github/workflows/fix-cms-transport-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/content-manager-v1.js index.html .github/workflows/fix-content-server-connection-final.yml .github/workflows/fix-cms-transport-v2.yml
          git commit -m 'Perbaiki koneksi server pengelola konten secara final'
          git push
