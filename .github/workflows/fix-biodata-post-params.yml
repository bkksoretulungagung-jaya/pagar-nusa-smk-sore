name: Fix biodata POST params

on:
  push:
    paths:
      - '.github/workflows/fix-biodata-post-params.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix Apps Script POST parsing
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('backend/Biodata.gs')
          s=p.read_text(encoding='utf-8')
          old="function doPost(e) {\n  const data = parseBody_(e);"
          new="function doPost(e) {\n  const data = Object.assign({}, (e && e.parameter) || {}, parseBody_(e));"
          if old not in s:
              raise SystemExit('Expected doPost parser line not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/Biodata.gs
          git commit -m 'Fix biodata Apps Script POST parameter parsing'
          git push