name: Install admin password v1

on:
  push:
    branches: [main]
    paths:
      - 'js/admin-password-v1.js'
      - 'tools/upgrade_admin_password_v1.py'
      - '.github/workflows/install-admin-password-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install secure admin password manager
        run: python tools/upgrade_admin_password_v1.py
      - name: Commit installation
        run: |
          if git diff --quiet -- backend/Code.gs js/ui-v9-core.js js/ui-v9.js index.html; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/Code.gs js/ui-v9-core.js js/ui-v9.js index.html
          git commit -m "Aktifkan menu ganti password admin aman"
          git push
