name: Add notification bell v42

on:
  push:
    paths:
      - '.github/workflows/add-notification-bell-v42.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add notification bell to homepage
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          css = r'''

/* NOTIFICATION BELL V42 */
.notificationBell{position:absolute;top:12px;right:142px;z-index:42;width:38px;height:38px;display:flex;align-items:center;justify-content:center;padding:0;border:1px solid rgba(255,255,255,.32);border-radius:12px;background:rgba(255,255,255,.14);color:#fff;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.12);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);transition:transform .18s ease,background .18s ease}
.notificationBell:hover,.notificationBell:focus-visible{background:rgba(255,255,255,.24);transform:translateY(-1px);outline:none}
.notificationBell svg{width:20px;height:20px;display:block;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.notificationBadge{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;padding:0 5px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;border:2px solid #14532d;border-radius:999px;background:#dc2626;color:#fff;font-size:9px;line-height:1;font-weight:1000;box-shadow:0 2px 7px rgba(127,29,29,.35)}
.notificationBadge.hidden{display:none!important}
.notificationPanel{position:absolute;top:58px;right:12px;z-index:60;width:min(360px,calc(100vw - 24px));display:none;overflow:hidden;background:#fff;color:#1f2937;border:1px solid #d7e4dc;border-radius:14px;box-shadow:0 14px 34px rgba(15,61,36,.24)}
.notificationPanel.open{display:block}
.notificationPanelHead{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 15px;background:#f0fdf4;border-bottom:1px solid #d7e4dc}
.notificationPanelHead strong{color:#14532d;font-size:13px;font-weight:1000;letter-spacing:.2px}
.notificationPanelHead span{color:#64748b;font-size:9px;font-weight:800}
.notificationList{max-height:330px;overflow:auto}
.notificationItem{display:block;padding:12px 15px;color:inherit;text-decoration:none;border-bottom:1px solid #edf3ef;transition:background .16s ease}
.notificationItem:last-child{border-bottom:0}
.notificationItem:hover,.notificationItem:focus{background:#f8fbf9;outline:none}
.notificationItemTitle{display:block;color:#153f28;font-size:11px;line-height:1.45;font-weight:900}
.notificationItemMeta{display:block;margin-top:4px;color:#64748b;font-size:9px;line-height:1.35;font-weight:700}
.notificationEmpty{padding:20px 15px;color:#64748b;font-size:11px;line-height:1.6;text-align:center}
@media(max-width:680px){.notificationBell{top:7px;left:9px;right:auto;width:36px;height:36px;border-radius:11px}.notificationPanel{top:50px;right:8px;width:calc(100vw - 16px)}.notificationBadge{border-color:#14532d}}
@media(prefers-reduced-motion:reduce){.notificationBell{transition:none}.notificationBell:hover,.notificationBell:focus-visible{transform:none}}
'''

          bell = r'''
  <button id="notificationBell" class="notificationBell" type="button" aria-label="Buka pemberitahuan" aria-expanded="false" aria-controls="notificationPanel">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
    <span id="notificationBadge" class="notificationBadge hidden" aria-hidden="true">0</span>
  </button>
  <div id="notificationPanel" class="notificationPanel" role="dialog" aria-label="Pemberitahuan terbaru">
    <div class="notificationPanelHead"><strong>PEMBERITAHUAN</strong><span id="notificationPanelStatus">Memuat...</span></div>
    <div id="notificationList" class="notificationList"><div class="notificationEmpty">Memuat pemberitahuan...</div></div>
  </div>
'''

          script = r'''
<!-- NOTIFICATION BELL SCRIPT V42 -->
<script>
(function(){
  const bell=document.getElementById('notificationBell');
  const panel=document.getElementById('notificationPanel');
  const badge=document.getElementById('notificationBadge');
  const list=document.getElementById('notificationList');
  const status=document.getElementById('notificationPanelStatus');
  if(!bell||!panel||!badge||!list||!status)return;

  const cards=Array.from(document.querySelectorAll('#newsSection .newsCard')).slice(0,5);
  const items=cards.map((card,index)=>{
    const title=(card.querySelector('h3')?.textContent||'Informasi terbaru').trim();
    const date=(card.querySelector('.newsDate')?.textContent||'').trim();
    const link=card.querySelector('.newsReadMore')?.getAttribute('href')||'#newsSection';
    return {title,date,link,index};
  });
  const signature=items.map(x=>x.title+'|'+x.date).join('||');
  let seen='';
  try{seen=localStorage.getItem('pnNotificationSeenV42')||''}catch(_e){}

  function render(){
    if(!items.length){
      list.innerHTML='<div class="notificationEmpty">Belum ada pemberitahuan baru.</div>';
      status.textContent='0 informasi';
      badge.classList.add('hidden');
      return;
    }
    list.innerHTML='';
    items.forEach(item=>{
      const a=document.createElement('a');
      a.className='notificationItem';
      a.href=item.link;
      const t=document.createElement('span');
      t.className='notificationItemTitle';
      t.textContent=item.title;
      const m=document.createElement('span');
      m.className='notificationItemMeta';
      m.textContent=item.date||'Kabar & informasi terbaru';
      a.append(t,m);
      list.appendChild(a);
    });
    status.textContent=items.length+' informasi terbaru';
    if(signature && signature!==seen){
      badge.textContent=String(items.length>9?'9+':items.length);
      badge.classList.remove('hidden');
      bell.setAttribute('aria-label',items.length+' pemberitahuan baru');
    }else{
      badge.classList.add('hidden');
      bell.setAttribute('aria-label','Buka pemberitahuan');
    }
  }

  function markSeen(){
    if(!signature)return;
    try{localStorage.setItem('pnNotificationSeenV42',signature)}catch(_e){}
    seen=signature;
    badge.classList.add('hidden');
    bell.setAttribute('aria-label','Buka pemberitahuan');
  }

  function setOpen(open){
    panel.classList.toggle('open',open);
    bell.setAttribute('aria-expanded',open?'true':'false');
    if(open)markSeen();
  }

  bell.addEventListener('click',function(e){
    e.stopPropagation();
    setOpen(!panel.classList.contains('open'));
  });
  panel.addEventListener('click',function(e){e.stopPropagation()});
  document.addEventListener('click',function(){setOpen(false)});
  document.addEventListener('keydown',function(e){if(e.key==='Escape')setOpen(false)});
  render();
})();
</script>
'''

          if '/* NOTIFICATION BELL V42 */' not in s:
              s = s.replace('</style>', css + '\n</style>', 1)

          if 'id="notificationBell"' not in s:
              anchor = '  <div id="siteDateTime" class="siteDateTime" aria-label="Tanggal dan waktu WIB">'
              if anchor not in s:
                  raise SystemExit('Header date/time anchor not found')
              s = s.replace(anchor, bell + anchor, 1)

          if '<!-- NOTIFICATION BELL SCRIPT V42 -->' not in s:
              if '</body>' not in s:
                  raise SystemExit('Closing body tag not found')
              s = s.replace('</body>', script + '\n</body>', 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit notification bell
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Tambah indikator pemberitahuan dengan ikon lonceng'
          git push
