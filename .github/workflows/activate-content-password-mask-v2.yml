name: Activate content password mask v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/activate-content-password-mask-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump loader cache
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='js/drive-image-fix-v2.js?v=5'
          if old not in s:
              raise SystemExit('Loader drive-image-fix v5 tidak ditemukan')
          p.write_text(s.replace(old,'js/drive-image-fix-v2.js?v=6',1),encoding='utf-8')
          PY
          grep -q 'drive-image-fix-v2.js?v=6' index.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/activate-content-password-mask-v2.yml
          git add index.html .github/workflows/activate-content-password-mask-v2.yml
          git commit -m 'Aktifkan password tersembunyi pengelola konten'
          git push
