name: Mask content manager password

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mask-content-password-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mask password input only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p = Path('js/content-manager-v1.js')
          s = p.read_text(encoding='utf-8')

          old = "async function connectContent(){\n  const password=window.prompt('Masukkan password admin untuk mengaktifkan pengelola konten:','');if(password===null)return false;"
          helper = '''function askContentPassword(){
  return new Promise(resolve=>{
    document.getElementById('pnCmsPasswordMask')?.remove();
    const wrap=document.createElement('div');
    wrap.id='pnCmsPasswordMask';
    wrap.style.cssText='position:fixed;inset:0;z-index:1000000;background:rgba(2,6,23,.68);display:flex;align-items:center;justify-content:center;padding:18px';
    const card=document.createElement('div');
    card.style.cssText='width:min(430px,100%);background:#fff;border-radius:16px;box-shadow:0 24px 70px rgba(0,0,0,.32);padding:22px;color:#1e293b';
    card.innerHTML='<div style="font-size:18px;font-weight:900;color:#14532d;margin-bottom:8px">Hubungkan Pengelola Konten</div><div style="font-size:12px;line-height:1.6;color:#64748b;margin-bottom:14px">Masukkan password pengelola konten. Karakter password disembunyikan.</div><label style="display:block;font-size:11px;font-weight:900;margin-bottom:6px">Password</label><input id="pnCmsPasswordInput" type="password" autocomplete="current-password" spellcheck="false" style="width:100%;box-sizing:border-box;border:1px solid #94a3b8;border-radius:10px;padding:12px 13px;font:inherit;font-size:15px;outline:none"><div style="display:flex;gap:10px;justify-content:flex-end;margin-top:16px"><button id="pnCmsPasswordCancel" type="button" style="border:0;border-radius:9px;padding:10px 16px;background:#e2e8f0;color:#334155;font-weight:900;cursor:pointer">BATAL</button><button id="pnCmsPasswordSubmit" type="button" style="border:0;border-radius:9px;padding:10px 16px;background:#0f766e;color:#fff;font-weight:900;cursor:pointer">HUBUNGKAN</button></div>';
    wrap.appendChild(card);document.body.appendChild(wrap);
    const input=card.querySelector('#pnCmsPasswordInput');
    const finish=value=>{wrap.remove();resolve(value)};
    card.querySelector('#pnCmsPasswordCancel').onclick=()=>finish(null);
    card.querySelector('#pnCmsPasswordSubmit').onclick=()=>finish(input.value);
    input.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();finish(input.value)}else if(e.key==='Escape'){e.preventDefault();finish(null)}});
    wrap.addEventListener('click',e=>{if(e.target===wrap)finish(null)});
    setTimeout(()=>input.focus(),30);
  });
}

async function connectContent(){
  const password=await askContentPassword();if(password===null)return false;'''

          if old not in s:
              raise SystemExit('Fungsi connectContent lama tidak ditemukan')
          s = s.replace(old, helper, 1)
          p.write_text(s, encoding='utf-8')

          idx = Path('index.html')
          t = idx.read_text(encoding='utf-8')
          old_tag = 'js/content-manager-v1.js?v=6'
          if old_tag not in t:
              raise SystemExit('Versi content-manager v6 tidak ditemukan')
          idx.write_text(t.replace(old_tag, 'js/content-manager-v1.js?v=7', 1), encoding='utf-8')
          PY

          node --check js/content-manager-v1.js
          grep -q 'type="password"' js/content-manager-v1.js
          grep -q 'await askContentPassword' js/content-manager-v1.js
          grep -q 'content-manager-v1.js?v=7' index.html

          rm -f .github/workflows/mask-content-password-v1.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/content-manager-v1.js index.html .github/workflows/mask-content-password-v1.yml
          git commit -m 'Sembunyikan karakter password pengelola konten'
          git push
