name: Install admin account create v2

on:
  push:
    branches: [main]
    paths:
      - 'tools/install_admin_account_create_v2.py'
      - 'backend/AdminAccountCreateV2.gs'
      - 'js/admin-account-create-v2.js'
      - '.github/workflows/install-admin-account-create-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install account create v2
        run: python tools/install_admin_account_create_v2.py
      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/Code.gs js/admin-compact-v1.js index.html
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Aktifkan buat akun anggota admin"
            git push
          fi
