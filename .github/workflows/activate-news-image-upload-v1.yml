name: Activate news image upload

on:
  push:
    paths:
      - '.github/workflows/activate-news-image-upload-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Load uploader directly and bust cache
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('js/content-manager-v1.js?v=2', 'js/content-manager-v1.js?v=3')
          s = s.replace('js/drive-image-fix-v2.js?v=2', 'js/drive-image-fix-v2.js?v=3')
          s = s.replace('js/news-image-manager-v1.js?v=2', 'js/news-image-manager-v1.js?v=3')
          s = s.replace('js/news-image-portrait-v1.js?v=1', 'js/news-image-portrait-v1.js?v=2')
          marker = '<script src="js/drive-image-fix-v2.js?v=3"></script>'
          news = '<script src="js/news-image-manager-v1.js?v=3"></script>'
          portrait = '<script src="js/news-image-portrait-v1.js?v=2"></script>'
          if news not in s:
              old_news = '<script src="js/news-image-manager-v1.js?v=2"></script>'
              if old_news in s:
                  s = s.replace(old_news, news, 1)
              elif marker in s:
                  s = s.replace(marker, marker + '\n' + news, 1)
              else:
                  raise SystemExit('news image manager marker not found')
          if portrait not in s:
              old_portrait = '<script src="js/news-image-portrait-v1.js?v=1"></script>'
              if old_portrait in s:
                  s = s.replace(old_portrait, portrait, 1)
              elif news in s:
                  s = s.replace(news, news + '\n' + portrait, 1)
              else:
                  raise SystemExit('news image manager script not found')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit activation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Aktifkan perbaikan ID gambar kabar v2"
            git push
          fi
