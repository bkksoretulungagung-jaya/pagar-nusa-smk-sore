name: Restore website before admin fixes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-before-admin-fixes.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore exact tree before admin fixes
        shell: bash
        run: |
          set -euo pipefail
          BASE='2b3e99a9382f5efc53412bd4734802316c84821c'

          git cat-file -e "$BASE^{commit}"
          git diff --name-only --diff-filter=A "$BASE"..HEAD -z > /tmp/files-added-after-base

          git checkout "$BASE" -- .

          while IFS= read -r -d '' f; do
            git rm -f --ignore-unmatch -- "$f"
          done < /tmp/files-added-after-base

          if ! git diff --quiet "$BASE" -- .; then
            echo 'Tree hasil restore belum identik dengan baseline:'
            git diff --stat "$BASE" -- .
            exit 1
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Kembalikan website ke kondisi sebelum perbaikan login admin'
          git push
