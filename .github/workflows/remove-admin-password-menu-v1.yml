name: Remove admin password menu v1

on:
  push:
    branches: [main]
    paths:
      - 'tools/remove_admin_password_menu_v1.py'
      - '.github/workflows/remove-admin-password-menu-v1.yml'

permissions:
  contents: write

jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove password menu
        run: python tools/remove_admin_password_menu_v1.py
      - name: Commit changes
        run: |
          if git diff --quiet -- index.html; then
            echo 'No index change needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Hapus menu ganti password admin dan pulihkan login lama'
          git push
