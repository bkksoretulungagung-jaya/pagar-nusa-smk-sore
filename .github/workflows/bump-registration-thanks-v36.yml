name: Bump registration thanks v37

on:
  push:
    paths:
      - '.github/workflows/bump-registration-thanks-v36.yml'

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump ui-v9 cache key
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          for old in ('js/ui-v9.js?v=36','js/ui-v9.js?v=35','js/ui-v9.js?v=34','js/ui-v9.js?v=33','js/ui-v9.js?v=32','js/ui-v9.js?v=28'):
              s=s.replace(old,'js/ui-v9.js?v=37')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit cache bump
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo 'No cache change needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Force refresh registration thank-you v37'
          git push
