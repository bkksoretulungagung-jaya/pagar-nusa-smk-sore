name: Install CBT form link admin v2

on:
  push:
    branches: [main]
    paths:
      - 'tools/install_cbt_form_link_admin_v2.py'
      - '.github/workflows/install-cbt-form-link-admin-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install CBT form link admin
        run: python tools/install_cbt_form_link_admin_v2.py
      - name: Commit installation
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "4189824+github-actions[bot]@users.noreply.github.com"
          git add js/cbt-toggle-v1.js siswa.html
          git commit -m "Tambah pengaturan link Google Form CBT dari admin"
          git push
