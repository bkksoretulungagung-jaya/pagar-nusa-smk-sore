name: Add news and information section

on:
  push:
    paths:
      - '.github/workflows/add-news-section.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add news section
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          if '/* NEWS SECTION V32 */' not in s:
              css_lines = [
                  '',
                  '/* NEWS SECTION V32 */',
                  '.newsSection{max-width:1180px;margin:18px auto 20px;padding:0 2px}',
                  '.newsHead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin:0 0 10px}',
                  '.newsHead h2{margin:0;color:#14532d;font-size:19px;font-weight:900;letter-spacing:.2px}',
                  '.newsHead p{margin:4px 0 0;color:#64748b;font-size:12px;line-height:1.45}',
                  '.newsLive{display:inline-flex;align-items:center;gap:7px;padding:6px 10px;border-radius:999px;background:#ecfdf3;border:1px solid #bbf7d0;color:#166534;font-size:10px;font-weight:900;white-space:nowrap}',
                  '.newsLiveDot{width:7px;height:7px;border-radius:50%;background:#16a34a;box-shadow:0 0 0 0 rgba(22,163,74,.45);animation:newsPulse 1.8s infinite}',
                  '@keyframes newsPulse{70%{box-shadow:0 0 0 7px rgba(22,163,74,0)}100%{box-shadow:0 0 0 0 rgba(22,163,74,0)}}',
                  '.newsTicker{overflow:hidden;margin-bottom:12px;border-radius:10px;background:#14532d;border:1px solid #166534;box-shadow:0 4px 12px rgba(20,83,45,.12)}',
                  '.newsTickerTrack{display:inline-block;min-width:100%;padding:8px 0;color:#fff;white-space:nowrap;font-size:11px;font-weight:800;animation:newsMove 24s linear infinite}',
                  '@keyframes newsMove{0%{transform:translateX(100%)}100%{transform:translateX(-100%)}}',
                  '.newsGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}',
                  '.newsCard{position:relative;overflow:hidden;background:#fff;border:1px solid #dbe7df;border-radius:13px;padding:15px 15px 14px;box-shadow:0 4px 14px rgba(15,61,36,.07);transition:transform .18s ease,box-shadow .18s ease}',
                  '.newsCard:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(15,61,36,.11)}',
                  '.newsMeta{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:9px}',
                  '.newsDate{color:#64748b;font-size:10px;font-weight:700}',
                  '.newsBadge{display:inline-flex;align-items:center;padding:3px 7px;border-radius:999px;background:#dcfce7;color:#166534;border:1px solid #bbf7d0;font-size:9px;font-weight:900;letter-spacing:.4px}',
                  '.newsCard h3{margin:0 0 7px;color:#153f28;font-size:14px;line-height:1.35;font-weight:900}',
                  '.newsCard p{margin:0;color:#475569;font-size:11px;line-height:1.6}',
                  '.newsIcon{width:31px;height:31px;border-radius:9px;display:flex;align-items:center;justify-content:center;margin-bottom:10px;background:#ecfdf3;color:#166534;font-size:16px}',
                  '@media(max-width:800px){.newsGrid{grid-template-columns:1fr}.newsSection{margin:14px 10px 18px}.newsHead{align-items:flex-start}.newsHead h2{font-size:17px}.newsCard{padding:14px}.newsTickerTrack{font-size:10px}}',
                  '@media(prefers-reduced-motion:reduce){.newsLiveDot,.newsTickerTrack{animation:none}.newsCard:hover{transform:none}}',
                  '',
              ]
              s = s.replace('</style>', '\n'.join(css_lines) + '</style>', 1)

          if 'id="newsSection"' not in s:
              marker = '  <section class="galleryCard" id="gallerySection">'
              if marker not in s:
                  raise SystemExit('Gallery marker not found')

              news_lines = [
                  '  <section id="newsSection" class="newsSection" aria-label="Kabar dan informasi terbaru">',
                  '    <div class="newsHead">',
                  '      <div><h2>KABAR & INFORMASI</h2><p>Pembaruan terbaru Pagar Nusa Rayon SMK Sore Tulungagung.</p></div>',
                  '      <span class="newsLive"><span class="newsLiveDot"></span> TERBARU</span>',
                  '    </div>',
                  '    <div class="newsTicker" aria-label="Headline terbaru"><div class="newsTickerTrack">KABAR TERBARU • Portal CBT siswa tersedia • Kontak resmi semakin lengkap • Galeri kegiatan dapat dilihat langsung di website •</div></div>',
                  '    <div class="newsGrid">',
                  '      <article class="newsCard">',
                  '        <div class="newsIcon" aria-hidden="true">🎓</div>',
                  '        <div class="newsMeta"><span class="newsDate">15 Agustus 2026</span><span class="newsBadge">BARU</span></div>',
                  '        <h3>Portal CBT Siswa Siap Digunakan</h3>',
                  '        <p>Siswa dapat mengakses halaman CBT melalui tombol LOGIN SISWA / CBT yang tersedia di halaman utama.</p>',
                  '      </article>',
                  '      <article class="newsCard">',
                  '        <div class="newsIcon" aria-hidden="true">☎</div>',
                  '        <div class="newsMeta"><span class="newsDate">15 Agustus 2026</span><span class="newsBadge">INFO</span></div>',
                  '        <h3>Kontak Resmi Kini Lebih Lengkap</h3>',
                  '        <p>Instagram, TikTok, Email, WhatsApp, dan alamat Sekretariat kini tersedia pada bagian bawah website.</p>',
                  '      </article>',
                  '      <article class="newsCard">',
                  '        <div class="newsIcon" aria-hidden="true">▣</div>',
                  '        <div class="newsMeta"><span class="newsDate">15 Agustus 2026</span><span class="newsBadge">GALERI</span></div>',
                  '        <h3>Dokumentasi Kegiatan Tersedia di Galeri</h3>',
                  '        <p>Lima foto dokumentasi kegiatan Pagar Nusa dapat dibuka dan diperbesar langsung dari halaman utama.</p>',
                  '      </article>',
                  '    </div>',
                  '  </section>',
                  '',
              ]
              s = s.replace(marker, '\n'.join(news_lines) + marker, 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit news section
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Tambahkan kabar dan informasi terbaru'
          git push
