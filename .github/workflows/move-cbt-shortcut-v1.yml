name: Move CBT shortcut v1

on:
  push:
    paths:
      - '.github/workflows/move-cbt-shortcut-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  move:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move Portal CBT next to Biodata
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # 1) Dashboard shortcut: add CBT immediately after BIODATA ANGGOTA.
          p = Path('js/dashboard-shortcuts-v1.js')
          s = p.read_text(encoding='utf-8')
          bio = "  {id:'studentBioShortcut',icon:'👤',label:'BIODATA ANGGOTA',action:'biodata'}"
          cbt = "  {id:'studentCbtShortcut',icon:'📝',label:'PORTAL CBT ONLINE',action:'cbt'}"
          if "action:'cbt'" not in s:
              s = s.replace(bio, bio + ',\n' + cbt)
          s = s.replace("['admin','biodata','registration'].includes(item.action)", "['admin','biodata','registration','cbt'].includes(item.action)")
          if '.pnDashShortcutBtn.cbtShortcut' not in s:
              anchor = "    .pnDashShortcutBtn.bioShortcut:hover,.pnDashShortcutBtn.bioShortcut:focus-visible{background:#0b5f59;border-color:#0b5f59;color:#fff}"
              addition = anchor + "\n    .pnDashShortcutBtn.cbtShortcut{background:#166534;border-color:#166534;color:#fff}\n    .pnDashShortcutBtn.cbtShortcut:hover,.pnDashShortcutBtn.cbtShortcut:focus-visible{background:#14532d;border-color:#14532d;color:#fff}"
              s = s.replace(anchor, addition)
          old_classes = "${item.action==='admin'?' adminShortcut':''}${item.action==='biodata'?' bioShortcut':''}${item.action==='registration'?' registrationShortcut':''}"
          new_classes = old_classes + "${item.action==='cbt'?' cbtShortcut':''}"
          s = s.replace(old_classes, new_classes)
          if 'function openCbtFromShortcut' not in s:
              marker = "function openBiodataFromShortcut(btn){\n  pulse(btn);\n  window.location.href='biodata.html?v=5';\n}\n"
              s = s.replace(marker, marker + "\nfunction openCbtFromShortcut(btn){\n  pulse(btn);\n  window.location.href='siswa.html';\n}\n")
          s = s.replace("else if(btn.dataset.action==='biodata')openBiodataFromShortcut(btn);", "else if(btn.dataset.action==='biodata')openBiodataFromShortcut(btn);\n      else if(btn.dataset.action==='cbt')openCbtFromShortcut(btn);")
          p.write_text(s, encoding='utf-8')

          # 2) Keep CBT ON/OFF setting working for the new dashboard shortcut.
          p = Path('js/cbt-toggle-v1.js')
          s = p.read_text(encoding='utf-8')
          old = '  html:not([data-pn-cbt="on"]) #studentCbtLoginBtn{display:none!important}\n  html[data-pn-cbt="on"] #studentCbtLoginBtn{display:inline-flex!important}'
          new = '  html:not([data-pn-cbt="on"]) #studentCbtLoginBtn,html:not([data-pn-cbt="on"]) #pnDashboardShortcuts [data-action="cbt"]{display:none!important}\n  html[data-pn-cbt="on"] #studentCbtLoginBtn,html[data-pn-cbt="on"] #pnDashboardShortcuts [data-action="cbt"]{display:inline-flex!important}'
          s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')

          # 3) Remove the old standalone CBT area from the bottom of the public page.
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = re.sub(r'\n\s*<div id="bottomAdminLogin" class="bottomAdminLogin">\s*<a id="studentCbtLoginBtn"[^>]*>.*?</a>\s*</div>\s*', '\n', s, count=1, flags=re.S)
          s = re.sub(r'js/dashboard-shortcuts-v1\.js\?v=\d+', 'js/dashboard-shortcuts-v1.js?v=8', s)
          s = re.sub(r'js/cbt-toggle-v1\.js\?v=\d+', 'js/cbt-toggle-v1.js?v=2', s)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html js/dashboard-shortcuts-v1.js js/cbt-toggle-v1.js
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Pindahkan Portal CBT ke sebelah Biodata Anggota"
            git push
          fi
