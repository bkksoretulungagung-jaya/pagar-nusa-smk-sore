name: Run Excel Cloud V5 installer once
on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/run-excel-cloud-v5-installer-temp.yml'
permissions:
  contents: write
jobs:
  install-v5-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/excel-cloud-reliable-v5
      - name: Execute installer embedded in PR branch
        shell: python
        run: |
          from pathlib import Path
          p=Path('.github/workflows/excel-cloud-reliable-v5-temp.yml')
          lines=p.read_text().splitlines()
          marker='      - name: Install reliable Excel cloud V5'
          i=lines.index(marker)
          while i < len(lines) and lines[i].strip() != 'run: |': i += 1
          i += 1
          out=[]
          while i < len(lines) and lines[i] != '      - name: Remove temporary installer':
              line=lines[i]
              out.append(line[10:] if line.startswith('          ') else line)
              i += 1
          script='\n'.join(out)+'\n'
          exec(compile(script,'excel-cloud-v5-installer','exec'),{})
      - name: Commit V5 generated changes to PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/Code.gs js/database-cloud-v1.js index.html
          git commit -m "Pasang transport Excel Cloud V5 yang tahan timeout"
          git push origin HEAD:agent/excel-cloud-reliable-v5
