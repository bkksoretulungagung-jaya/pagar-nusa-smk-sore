name: Restore content password to first admin

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-content-password-first-admin.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore content manager auth compatibility
        shell: bash
        run: |
          set -euo pipefail

          cat > js/content-password-mask-v1.js <<'JS'
          (()=>{
          'use strict';

          const ENDPOINT='https://script.google.com/macros/s/AKfycbyJi_83lJ11JshOLCzIBRMX6fEi-y9UGR9eYULuqH1BivdxeqcgMB0l2ehWBIgaad8Oyw/exec';
          const TOKEN_KEY='pnReviewAdminToken';
          const FIRST_HASH=(typeof PN_ADMIN_PASS_HASH==='string'&&PN_ADMIN_PASS_HASH)||'3b396371ec891e73db1ecb5f70d341c4fe6cc6f52fdea96d55dc3fe786d3a639';
          let busy=false;
          const $=id=>document.getElementById(id);

          async function sha256Hex(text){
            const data=new TextEncoder().encode(String(text||''));
            const buf=await crypto.subtle.digest('SHA-256',data);
            return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
          }

          function rid(){return 'cmsrestore-'+Date.now()+'-'+Math.random().toString(36).slice(2)}

          function directPost(action,payload={},timeout=18000){
            return new Promise((resolve,reject)=>{
              const requestId=rid();
              const frame=document.createElement('iframe');
              frame.name='pnCmsRestoreFrame_'+requestId.replace(/\W/g,'');
              frame.style.display='none';frame.setAttribute('aria-hidden','true');
              const form=document.createElement('form');
              form.method='POST';form.action=ENDPOINT;form.target=frame.name;form.style.display='none';
              Object.entries({action,rid:requestId,...payload}).forEach(([k,v])=>{
                const i=document.createElement('input');i.type='hidden';i.name=k;i.value=String(v??'');form.appendChild(i);
              });
              let done=false;
              const clean=()=>{if(done)return;done=true;clearTimeout(timer);window.removeEventListener('message',onMessage);setTimeout(()=>frame.remove(),100)};
              const onMessage=e=>{
                const d=e?.data;
                if(!d||d.source!=='pn-content'||String(d.rid||'')!==requestId)return;
                clean();
                if(d.ok)resolve(d);else reject(new Error(d.message||'Permintaan pengelola konten ditolak server.'));
              };
              window.addEventListener('message',onMessage);
              const timer=setTimeout(()=>{clean();reject(new Error('Server pengelola konten tidak memberi respons.'))},timeout);
              document.body.append(frame,form);form.submit();form.remove();
            });
          }

          function jsonp(action,payload={},timeout=10000){
            return new Promise((resolve,reject)=>{
              const cb='pnCmsRestoreCb_'+Date.now()+'_'+Math.random().toString(36).slice(2).replace(/\W/g,'');
              const s=document.createElement('script');let done=false;
              const clean=()=>{clearTimeout(timer);try{delete window[cb]}catch(_){};s.remove()};
              window[cb]=d=>{if(done)return;done=true;clean();resolve(d)};
              const q=new URLSearchParams({action,callback:cb,_ts:String(Date.now())});
              Object.entries(payload).forEach(([k,v])=>q.set(k,String(v??'')));
              s.src=ENDPOINT+'?'+q.toString();s.async=true;
              s.onerror=()=>{if(done)return;done=true;clean();reject(new Error('Server pengelola konten tidak dapat dihubungi.'))};
              const timer=setTimeout(()=>{if(done)return;done=true;clean();reject(new Error('Server pengelola konten terlalu lama merespons.'))},timeout);
              document.head.appendChild(s);
            });
          }

          async function loginServer(password){
            const r=await directPost('contentAdminLogin',{username:'admin',password},18000);
            const token=String(r?.token||'');
            if(!token)throw new Error('Token pengelola konten tidak diterima.');
            return token;
          }

          async function resetServerPassword(token,currentPassword,firstPassword){
            return directPost('adminChangePassword',{token,currentPassword,newPassword:firstPassword},18000);
          }

          async function tokenValid(token){
            if(!token)return false;
            try{const r=await jsonp('contentAdminList',{token},10000);return !!r?.ok}catch(_){return false}
          }

          function ensureStyles(){
            if($('pnCmsMaskStyles'))return;
            const s=document.createElement('style');s.id='pnCmsMaskStyles';
            s.textContent=`
            .pnCmsMaskModal{position:fixed;inset:0;z-index:120000;display:flex;align-items:center;justify-content:center;padding:18px;background:rgba(0,0,0,.62)}
            .pnCmsMaskCard{width:min(590px,100%);background:#151b15;color:#f8fafc;border:1px solid rgba(255,255,255,.16);border-radius:18px;box-shadow:0 26px 80px rgba(0,0,0,.45);overflow:hidden}
            .pnCmsMaskHead{padding:20px 24px 8px;font-size:17px;font-weight:900;color:#fff}.pnCmsMaskBody{padding:10px 24px 24px}
            .pnCmsMaskText{margin:0 0 11px;color:#e5e7eb;font-size:14px;line-height:1.55}.pnCmsMaskNote{margin:10px 0;padding:10px 12px;border:1px solid #8a6d2f;border-radius:10px;background:#2a2415;color:#fde7a7;font-size:12px;line-height:1.55}
            .pnCmsMaskField{margin-top:11px}.pnCmsMaskField label{display:block;margin:0 0 6px;color:#e5e7eb;font-size:12px;font-weight:800}.pnCmsMaskInput{width:100%;box-sizing:border-box;border:2px solid #9dd890;border-radius:11px;padding:12px 13px;background:#171d17;color:#fff;font:inherit;font-size:16px;outline:none}.pnCmsMaskInput:focus{box-shadow:0 0 0 3px rgba(157,216,144,.16)}
            .pnCmsMaskError{min-height:19px;margin:9px 0 0;color:#fecaca;font-size:12px;font-weight:700;line-height:1.45}.pnCmsMaskActions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}.pnCmsMaskBtn{border:0;border-radius:999px;padding:11px 22px;font:inherit;font-size:14px;font-weight:900;cursor:pointer}.pnCmsMaskBtn.ok{background:#9edb8c;color:#0b3b13}.pnCmsMaskBtn.cancel{background:#1d5d20;color:#fff}.pnCmsMaskBtn:disabled{opacity:.55;cursor:not-allowed}.pnCmsMaskHidden{display:none!important}
            @media(max-width:600px){.pnCmsMaskCard{border-radius:14px}.pnCmsMaskHead{padding:18px 18px 7px}.pnCmsMaskBody{padding:10px 18px 18px}.pnCmsMaskActions{gap:8px}.pnCmsMaskBtn{padding:10px 18px}}
            `;document.head.appendChild(s);
          }

          function setStatus(text,type='ok'){
            const el=$('pnCmsStatus');if(!el)return;el.textContent=text;el.className='pnCmsStatus '+type;
          }

          function markConnected(resetDone=false){
            setStatus(resetDone?'✓ Password pengelola konten sudah disamakan kembali dengan password admin utama. Akses online aktif.':'✓ Akses pengelola konten online aktif.','ok');
            setTimeout(()=>$('pnCmsReload')?.click(),0);
          }

          function openRestorePassword(){
            ensureStyles();$('pnCmsMaskModal')?.remove();
            return new Promise(resolve=>{
              const modal=document.createElement('div');modal.id='pnCmsMaskModal';modal.className='pnCmsMaskModal';
              modal.innerHTML=`<div class="pnCmsMaskCard"><div class="pnCmsMaskHead">www.pagarnusasmksore.com</div><form id="pnCmsMaskForm" class="pnCmsMaskBody"><p class="pnCmsMaskText">Masukkan <b>password admin utama yang pertama</b>. Sistem akan mencoba mengaktifkan pengelola konten dengan password yang sama.</p><div class="pnCmsMaskField"><label>Password admin utama</label><input id="pnCmsMaskFirst" class="pnCmsMaskInput" type="password" autocomplete="current-password" required></div><div id="pnCmsMaskServerWrap" class="pnCmsMaskHidden"><div class="pnCmsMaskNote">Password server pengelola konten pernah berubah. Masukkan password server yang pernah dibuat pada layar <b>AKTIFKAN PASSWORD SERVER ADMIN</b>. Password ini hanya dipakai sekali untuk menyamakan server kembali ke password admin utama.</div><div class="pnCmsMaskField"><label>Password server pengelola konten saat ini</label><input id="pnCmsMaskServer" class="pnCmsMaskInput" type="password" autocomplete="current-password"></div></div><div id="pnCmsMaskError" class="pnCmsMaskError"></div><div class="pnCmsMaskActions"><button id="pnCmsMaskOk" class="pnCmsMaskBtn ok" type="submit">AKTIFKAN</button><button id="pnCmsMaskCancel" class="pnCmsMaskBtn cancel" type="button">BATAL</button></div></form></div>`;
              document.body.appendChild(modal);
              const first=$('pnCmsMaskFirst'),server=$('pnCmsMaskServer'),serverWrap=$('pnCmsMaskServerWrap'),form=$('pnCmsMaskForm'),ok=$('pnCmsMaskOk'),cancel=$('pnCmsMaskCancel'),err=$('pnCmsMaskError');
              let needsServer=false;
              const finish=value=>{modal.remove();resolve(value)};
              const setBusy=(v,text)=>{busy=v;ok.disabled=v;cancel.disabled=v;ok.textContent=v?(text||'MEMERIKSA...'):(needsServer?'SAMAKAN & AKTIFKAN':'AKTIFKAN')};
              cancel.onclick=()=>finish(null);modal.addEventListener('click',e=>{if(e.target===modal)finish(null)});
              form.addEventListener('submit',async e=>{
                e.preventDefault();if(busy)return;err.textContent='';
                const firstPassword=first.value;
                if(!firstPassword){err.textContent='Password admin utama wajib diisi.';return}
                const hash=await sha256Hex(firstPassword);
                if(hash!==FIRST_HASH){err.textContent='Password admin utama tidak sama dengan password login admin pertama.';first.focus();return}
                setBusy(true,'MEMERIKSA...');
                try{
                  if(!needsServer){
                    try{
                      const token=await loginServer(firstPassword);
                      sessionStorage.setItem(TOKEN_KEY,token);markConnected(false);finish({ok:true,reset:false});return;
                    }catch(_){
                      needsServer=true;serverWrap.classList.remove('pnCmsMaskHidden');err.textContent='Password admin utama benar, tetapi password server pengelola konten sudah berbeda. Masukkan password server saat ini di kolom tambahan.';setBusy(false);server.focus();return;
                    }
                  }
                  const currentServer=server.value;
                  if(!currentServer){throw new Error('Password server pengelola konten saat ini wajib diisi.')}
                  setBusy(true,'MENYAMAKAN...');
                  const token=await loginServer(currentServer);
                  if(currentServer!==firstPassword){
                    await resetServerPassword(token,currentServer,firstPassword);
                  }
                  const freshToken=await loginServer(firstPassword);
                  sessionStorage.setItem(TOKEN_KEY,freshToken);markConnected(true);finish({ok:true,reset:true});
                }catch(ex){err.textContent=String(ex?.message||ex||'Gagal mengaktifkan pengelola konten.');setBusy(false)}
              });
              setTimeout(()=>first.focus(),30);
            });
          }

          async function handleProtectedClick(btn){
            const isConnect=btn.id==='pnCmsConnect';
            const existing=sessionStorage.getItem(TOKEN_KEY)||'';
            if(isConnect&&existing&&await tokenValid(existing)){markConnected(false);return true}
            if(isConnect&&existing)sessionStorage.removeItem(TOKEN_KEY);
            if(!isConnect&&existing)return false;
            const result=await openRestorePassword();
            if(!result)return true;
            if(!isConnect)setTimeout(()=>btn.click(),0);
            return true;
          }

          const nativePrompt=window.prompt.bind(window);let promptBusy=false;
          window.prompt=function(message,defaultValue){
            const text=String(message||'');
            if(/Masukkan password admin untuk mengaktifkan pengelola konten/i.test(text)){
              if(!promptBusy){promptBusy=true;openRestorePassword().finally(()=>{promptBusy=false})}
              return null;
            }
            return nativePrompt(message,defaultValue);
          };

          document.addEventListener('click',e=>{
            const btn=e.target?.closest?.('#pnCmsConnect,#pnCmsSaveContent,#pnCmsSaveGallery');if(!btn)return;
            if(btn.id!=='pnCmsConnect'&&sessionStorage.getItem(TOKEN_KEY))return;
            e.preventDefault();e.stopImmediatePropagation();handleProtectedClick(btn);
          },true);

          })();
          JS

          python - <<'PY'
          from pathlib import Path

          p=Path('js/content-manager-v1.js')
          s=p.read_text(encoding='utf-8')
          start=s.index('async function postReliable(action,payload={},timeout=50000){')
          end=s.index('\nfunction ensureStyles(){', start)
          replacement=r'''async function postReliable(action,payload={},timeout=50000){
            const rid=makeRid();
            return new Promise((resolve,reject)=>{
              const frame=document.createElement('iframe');
              frame.name='pnCmsFrame_'+rid.replace(/\W/g,'');
              frame.style.display='none';frame.setAttribute('aria-hidden','true');
              const form=document.createElement('form');
              form.method='POST';form.action=ENDPOINT;form.target=frame.name;form.style.display='none';
              Object.entries({action,rid,...payload}).forEach(([k,v])=>{const input=document.createElement('input');input.type='hidden';input.name=k;input.value=String(v??'');form.appendChild(input)});
              let done=false;
              const clean=()=>{if(done)return;done=true;clearTimeout(timer);window.removeEventListener('message',onMessage);setTimeout(()=>frame.remove(),100)};
              const onMessage=e=>{
                const d=e?.data;
                if(!d||d.source!==SOURCE||String(d.rid||'')!==rid)return;
                clean();
                if(d.ok)resolve(d);else reject(new Error(d.message||'Perubahan konten ditolak server.'));
              };
              window.addEventListener('message',onMessage);
              const timer=setTimeout(()=>{clean();reject(new Error('Server konten tidak merespons tepat waktu.'))},timeout);
              document.body.append(frame,form);form.submit();form.remove();
            });
          }
          '''
          s=s[:start]+replacement+s[end:]
          p.write_text(s,encoding='utf-8')

          p=Path('js/drive-image-fix-v2.js')
          s=p.read_text(encoding='utf-8').replace('content-password-mask-v1.js?v=3','content-password-mask-v1.js?v=4')
          p.write_text(s,encoding='utf-8')

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('js/content-manager-v1.js?v=3','js/content-manager-v1.js?v=4')
          s=s.replace('js/drive-image-fix-v2.js?v=3','js/drive-image-fix-v2.js?v=4')
          p.write_text(s,encoding='utf-8')
          PY

          rm -f .github/workflows/check-content-backend-now.yml
          rm -f .github/workflows/restore-content-password-first-admin.yml

          node --check js/content-password-mask-v1.js
          node --check js/content-manager-v1.js
          node --check js/drive-image-fix-v2.js
          grep -q 'SAMAKAN & AKTIFKAN' js/content-password-mask-v1.js
          grep -q 'd.source!==SOURCE' js/content-manager-v1.js
          grep -q 'content-manager-v1.js?v=4' index.html
          grep -q 'drive-image-fix-v2.js?v=4' index.html

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Pulihkan password pengelola konten ke login admin pertama'
          git push
