name: Remove biodata member ID login v10

on:
  push:
    branches: [main]
    paths:
      - 'tools/remove_biodata_memberid_login_v10.py'
      - '.github/workflows/remove-biodata-memberid-login-v10.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update biodata login
        run: python tools/remove_biodata_memberid_login_v10.py
      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add biodata.html backend/Biodata.gs
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Sederhanakan login biodata tanpa input ID Anggota"
            git push
          fi
