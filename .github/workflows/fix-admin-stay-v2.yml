name: Fix Admin Stay V2

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-admin-stay-v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch admin stay guard V2
        run: python3 tools/fix_admin_stay_v2.py

      - name: Verify patch
        run: |
          grep -q "Jangan izinkan proses sinkronisasi/token mengeluarkan admin otomatis" js/ui-v9-core.js
          grep -q "localStorage.setItem('pnAdminAuth','1');sessionStorage.setItem('pnAdminAuth','1')" js/content-manager-v1.js
          grep -q "js/ui-v9.js?v=56" index.html
          grep -q "js/content-manager-v1.js?v=9" index.html
          grep -q "js/reviews-admin-session-v10.js?v=14" index.html

      - name: Commit hasil patch
        run: |
          git config user.name "OpenAI"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/fix-admin-stay-v2.yml
          git rm -f tools/fix_admin_stay_v2.py
          git add js/ui-v9-core.js js/ui-v9.js js/content-manager-v1.js index.html
          git commit -m "Kunci sesi admin agar tetap di database"
          git push origin HEAD:main
