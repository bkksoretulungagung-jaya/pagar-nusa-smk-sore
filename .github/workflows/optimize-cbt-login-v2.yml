name: Optimize CBT login v2

on:
  push:
    branches: [main]
    paths:
      - 'tools/optimize_cbt_login_v2.py'
      - '.github/workflows/optimize-cbt-login-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Optimize CBT login
        run: python tools/optimize_cbt_login_v2.py
      - name: Commit optimization
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "418982+github-actions[bot]@users.noreply.github.com"
          git add backend/Code.gs siswa.html
          git commit -m "Percepat login Portal CBT"
          git push
