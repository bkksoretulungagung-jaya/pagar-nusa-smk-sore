name: Add reviews and rating section

on:
  push:
    paths:
      - '.github/workflows/add-reviews-section.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch homepage reviews
        run: python3 tools/add_reviews.py
      - name: Commit homepage reviews
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Tambahkan ulasan dan rating di dashboard'
          git push
