name: Fix admin login override v1

on:
  push:
    branches: [main]
    paths:
      - 'tools/fix_admin_login_override_v1.py'
      - '.github/workflows/fix-admin-login-override-v1.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix admin login override
        run: python tools/fix_admin_login_override_v1.py
      - name: Commit fix
        run: |
          if git diff --quiet -- js/admin-auth-v5.js js/reviews-admin-session-v10.js index.html; then
            echo 'No changes needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/admin-auth-v5.js js/reviews-admin-session-v10.js index.html
          git commit -m 'Cegah moderasi menimpa login admin server'
          git push
