name: Activate activity gallery auto slide

on:
  push:
    paths:
      - '.github/workflows/activate-gallery-auto-slide-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Load activity gallery slider
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="js/gallery-auto-slide-v1.js?v=1"></script>'
          if tag not in s:
              markers=[
                  '<script src="js/news-image-portrait-v1.js?v=1"></script>',
                  '<script src="js/news-image-manager-v1.js?v=3"></script>',
                  '<script src="js/admin-compact-v1.js?v=2"></script>'
              ]
              done=False
              for marker in markers:
                  if marker in s:
                      if 'admin-compact' in marker:
                          s=s.replace(marker,tag+'\n'+marker,1)
                      else:
                          s=s.replace(marker,marker+'\n'+tag,1)
                      done=True
                      break
              if not done:
                  raise SystemExit('script insertion marker not found')
          p.write_text(s,encoding='utf-8')
          PY

      - name: Commit slider activation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Aktifkan slide otomatis galeri kegiatan"
            git push
          fi
