name: Temporary Excel Cloud V3 installer

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'tools/install_excel_cloud_chunked_v3.py'
      - '.github/workflows/excel-cloud-chunked-v3-temp.yml'

permissions:
  contents: write

jobs:
  install:
    if: github.head_ref == 'agent/excel-cloud-chunked-v3'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Install chunked Excel cloud
        run: python3 tools/install_excel_cloud_chunked_v3.py
      - name: Remove temporary installer
        run: |
          git rm tools/install_excel_cloud_chunked_v3.py
          git rm .github/workflows/excel-cloud-chunked-v3-temp.yml
      - name: Commit generated changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/Code.gs js/database-cloud-v1.js index.html
          git commit -m 'Pasang download Excel cloud bertahap V3'
          git push origin HEAD:${{ github.head_ref }}
