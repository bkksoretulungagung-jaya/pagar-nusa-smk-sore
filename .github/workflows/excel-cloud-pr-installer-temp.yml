name: Temporary Excel cloud PR installer

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'js/database-cloud-v1.js'
      - 'tools/install_excel_cloud_sync_v1.py'

permissions:
  contents: write

jobs:
  install:
    if: github.head_ref == 'agent/excel-cloud-sync-v1' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Install Excel cloud sync
        run: python tools/install_excel_cloud_sync_v1.py
      - name: Commit generated changes to PR branch
        run: |
          rm -f .github/workflows/excel-cloud-pr-installer-temp.yml
          if git diff --quiet -- backend/Code.gs index.html .github/workflows/excel-cloud-pr-installer-temp.yml; then
            echo 'No generated changes needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/Code.gs index.html .github/workflows/excel-cloud-pr-installer-temp.yml
          git commit -m 'Pasang sinkronisasi database Excel cloud v1'
          git push origin HEAD:${{ github.head_ref }}
