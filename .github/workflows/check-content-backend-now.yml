name: Check content backend now

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/check-content-backend-now.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check live backend
        shell: bash
        run: |
          set -euo pipefail
          URL='https://script.google.com/macros/s/AKfycbyJi_83lJ11JshOLCzIBRMX6fEi-y9UGR9eYULuqH1BivdxeqcgMB0l2ehWBIgaad8Oyw/exec'
          echo '=== health ==='
          curl -L --max-time 30 -sS "$URL?action=health"
          echo
          echo '=== contentPublicList ==='
          curl -L --max-time 30 -sS "$URL?action=contentPublicList"
          echo
