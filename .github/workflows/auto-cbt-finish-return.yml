name: Auto CBT finish menu on return

on:
  push:
    paths:
      - '.github/workflows/auto-cbt-finish-return.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch siswa portal
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('siswa.html')
          s=p.read_text(encoding='utf-8')

          s=s.replace(
            ".finishBtn{width:100%;background:#0f766e;color:#fff;font-weight:900}.finishBtn:hover{filter:brightness(1.04)}",
            ".finishBtn{width:100%;background:#0f766e;color:#fff;font-weight:900}.finishBtn:hover{filter:brightness(1.04)}.finishWrap.autoReady{padding:16px;border:2px solid #22c55e;border-radius:12px;background:#f0fdf4;box-shadow:0 0 0 5px rgba(34,197,94,.10);animation:pnCbtReady 1s ease 2}@keyframes pnCbtReady{0%,100%{transform:none}50%{transform:scale(1.015)}}"
          )

          s=s.replace(
            "  examBtn.addEventListener('click',()=>{\n    if(!currentStudentUser) return;\n    sessionStorage.setItem(startedKey(currentStudentUser),'1');\n    finishWrap.classList.remove('hidden');\n  });",
            "  examBtn.addEventListener('click',()=>{\n    if(!currentStudentUser) return;\n    sessionStorage.setItem(startedKey(currentStudentUser),'1');\n    sessionStorage.setItem(startedKey(currentStudentUser)+':at',String(Date.now()));\n    finishWrap.classList.add('hidden');\n    finishWrap.classList.remove('autoReady');\n  });"
          )

          marker="  finishExamBtn.addEventListener('click',()=>{"
          insert="""  function revealFinishAfterReturn(){\n    if(!currentStudentUser) return;\n    if(sessionStorage.getItem(startedKey(currentStudentUser))!=='1') return;\n    if(sessionStorage.getItem(completedKey(currentStudentUser))==='1') return;\n    finishWrap.classList.remove('hidden');\n    finishWrap.classList.add('autoReady');\n    const hint=finishWrap.querySelector('.finishHint');\n    if(hint) hint.innerHTML='Jika Google Form sudah menampilkan halaman <b>TERIMA KASIH</b> seperti tanda bahwa jawaban berhasil dikirim, tekan tombol berikut untuk menyelesaikan sesi CBT.';\n    setTimeout(()=>finishWrap.scrollIntoView({behavior:'smooth',block:'center'}),180);\n  }\n  document.addEventListener('visibilitychange',()=>{\n    if(!document.hidden) setTimeout(revealFinishAfterReturn,250);\n  });\n  window.addEventListener('focus',()=>setTimeout(revealFinishAfterReturn,250));\n"""
          if insert.strip() not in s:
              s=s.replace(marker,insert+marker)

          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit change
        shell: bash
        run: |
          if git diff --quiet -- siswa.html; then
            echo 'No change needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add siswa.html
          git commit -m 'Show CBT finish menu automatically when student returns'
          git push
