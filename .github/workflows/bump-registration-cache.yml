name: Bump registration cache

on:
  push:
    paths:
      - '.github/workflows/bump-registration-cache.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump ui-v9 cache version
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='js/ui-v9.js?v=28'
          new='js/ui-v9.js?v=32'
          if old not in s:
              print('Old cache key not found; current file may already be updated.')
          else:
              p.write_text(s.replace(old,new),encoding='utf-8')
          PY
      - name: Commit cache bump
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo 'No change needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Force refresh permanent registration backend'
          git push
