name: Performance V2

on:
  push:
    paths:
      - '.github/workflows/performance-v2.yml'

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply performance patch
        run: python .github/scripts/performance_v2.py

      - name: Syntax check
        run: |
          node --check js/part2.js
          node --check js/part7.js
          node --check js/database-cloud-v1.js
          node --check js/ui-v9-core.js
          node --check js/content-manager-v1.js
          node --check js/reviews-admin-session-v10.js
          node --check js/admin-notifications-v1.js

      - name: Commit optimized files
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html js/part2.js js/part7.js js/database-cloud-v1.js js/ui-v9.js js/ui-v9-core.js js/content-manager-v1.js js/reviews-admin-session-v10.js js/admin-notifications-v1.js
          git commit -m "Percepat pembukaan admin dan database"
          git push origin HEAD:main
