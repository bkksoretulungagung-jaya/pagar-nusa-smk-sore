name: Install admin auth direct v7

on:
  push:
    branches: [main]
    paths:
      - 'tools/install_admin_auth_direct_v7.py'
      - '.github/workflows/install-admin-auth-direct-v7.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install direct admin login
        run: python tools/install_admin_auth_direct_v7.py
      - name: Syntax check
        run: node --check js/admin-auth-direct-v7.js
      - name: Commit installed files
        run: |
          if git diff --quiet -- js/admin-auth-direct-v7.js index.html; then
            echo 'No changes needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/admin-auth-direct-v7.js index.html
          git commit -m 'Pasang login admin direct v7'
          git push
