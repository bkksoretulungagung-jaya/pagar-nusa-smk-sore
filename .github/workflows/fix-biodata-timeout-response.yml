name: Fix biodata response transport

on:
  push:
    paths:
      - '.github/workflows/fix-biodata-timeout-response.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix Apps Script response and portal timeout
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          # Backend: Apps Script HtmlService may add an extra Google wrapper iframe.
          # Send the result to both parent and top so the external portal receives it.
          p=Path('backend/Biodata.gs')
          s=p.read_text(encoding='utf-8')
          old="    'window.parent.postMessage(' + payload + ',\"*\");' +\n"
          new=("    'try{window.parent.postMessage(' + payload + ',\\\"*\\\");}catch(e){}' +\n"
               "    'try{window.top.postMessage(' + payload + ',\\\"*\\\");}catch(e){}' +\n")
          if old not in s:
              raise SystemExit('Expected parent postMessage line not found in backend/Biodata.gs')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          # Frontend: allow Apps Script cold starts more time.
          b=Path('biodata.html')
          x=b.read_text(encoding='utf-8')
          if "},15000);" not in x:
              raise SystemExit('Expected 15s timeout not found in biodata.html')
          x=x.replace("},15000);","},30000);",1)
          b.write_text(x,encoding='utf-8')

          # Cache bust portal link and main UI loader.
          u=Path('js/ui-v9.js')
          y=u.read_text(encoding='utf-8')
          y=y.replace("bio.href='biodata.html?v=2';","bio.href='biodata.html?v=3';")
          u.write_text(y,encoding='utf-8')

          i=Path('index.html')
          z=i.read_text(encoding='utf-8')
          z=z.replace('js/ui-v9.js?v=41','js/ui-v9.js?v=42')
          i.write_text(z,encoding='utf-8')
          PY
      - name: Commit fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/Biodata.gs biodata.html js/ui-v9.js index.html
          if git diff --cached --quiet; then
            echo 'No change needed.'
            exit 0
          fi
          git commit -m 'Fix biodata Apps Script iframe response transport'
          git push
