name: Patch Aspel Monitor Backend

on:
  push:
    branches:
      - agent/aspel-monitoring
    paths:
      - .github/workflows/patch-aspel-monitor.yml

permissions:
  contents: write

jobs:
  patch-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/aspel-monitoring
          fetch-depth: 0
      - name: Patch backend Code.gs
        shell: bash
        run: |
          echo '' | base64 -d | python3
      - name: Commit backend patch
        shell: bash
        run: |
          git config user.name "OpenAI"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/Code.gs
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan backend."
            exit 0
          fi
          git commit -m "Tambah endpoint admin pemantauan Aspel"
          git push origin HEAD:agent/aspel-monitoring
