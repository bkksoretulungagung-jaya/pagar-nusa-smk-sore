name: Bump Aspel Monitor Cache

on:
  push:
    branches:
      - agent/aspel-monitoring
    paths:
      - .github/workflows/patch-aspel-monitor.yml

permissions:
  contents: write

jobs:
  bump-cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/aspel-monitoring
          fetch-depth: 0
      - name: Bump admin compact cache version
        shell: bash
        run: |
          sed -i 's#js/admin-compact-v1.js?v=2#js/admin-compact-v1.js?v=3#g' index.html
      - name: Commit cache bump
        shell: bash
        run: |
          git config user.name "OpenAI"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Versi cache sudah terbaru."
            exit 0
          fi
          git commit -m "Paksa muat menu pemantauan Aspel terbaru"
          git push origin HEAD:agent/aspel-monitoring
