name: Install admin password safe v2

on:
  push:
    paths:
      - 'tools/install_admin_password_safe_v2.py'
      - '.github/workflows/install-admin-password-safe-v2.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Install safe admin password menu
        run: python tools/install_admin_password_safe_v2.py
      - name: Commit installation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/Code.gs index.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Pasang menu ganti password admin aman v2"
            git push origin main
          fi
