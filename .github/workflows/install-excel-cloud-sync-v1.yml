name: Install Excel cloud sync v1

on:
  push:
    branches:
      - agent/excel-cloud-sync-v1
    paths:
      - 'js/database-cloud-v1.js'
      - 'tools/install_excel_cloud_sync_v1.py'
      - '.github/workflows/install-excel-cloud-sync-v1.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Excel cloud sync v1
        run: python tools/install_excel_cloud_sync_v1.py
      - name: Commit generated installation
        run: |
          if git diff --quiet -- backend/Code.gs index.html; then
            echo 'No generated changes needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/Code.gs index.html
          git commit -m 'Pasang sinkronisasi database Excel cloud v1'
          git push
