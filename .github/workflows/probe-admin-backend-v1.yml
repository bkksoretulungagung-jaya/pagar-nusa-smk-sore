name: Probe admin backend v1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-admin-backend-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe health endpoint
        run: |
          set -e
          URL='https://script.google.com/macros/s/AKfycbyJi_83lJ11JshOLCzIBRMX6fEi-y9UGR9eYULuqH1BivdxeqcgMB0l2ehWBIgaad8Oyw/exec?action=health'
          echo '=== HEALTH ==='
          curl -L --fail --silent --show-error --max-time 25 "$URL" | head -c 4000
          echo
      - name: Probe content public endpoint
        run: |
          set -e
          URL='https://script.google.com/macros/s/AKfycbyJi_83lJ11JshOLCzIBRMX6fEi-y9UGR9eYULuqH1BivdxeqcgMB0l2ehWBIgaad8Oyw/exec?action=contentPublicList'
          echo '=== CONTENT PUBLIC ==='
          curl -L --fail --silent --show-error --max-time 25 "$URL" | head -c 4000
          echo
