name: Temporary Excel Cloud V5 reliable transport installer
on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/excel-cloud-reliable-v5-temp.yml'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Install reliable Excel cloud V5
        shell: python
        run: |
          from pathlib import Path

          backend = Path('backend/Code.gs')
          s = backend.read_text()
          s = s.replace("const PN_EXCEL_CHUNK_BYTES = 1024 * 1024;", "const PN_EXCEL_CHUNK_BYTES = 512 * 1024;")

          old_manifest = '''function excelDatabaseManifest_(data) {
  requireReviewAdmin_(data.token);
  const file = excelDatabaseCurrentFile_();
  if (!file) return {ok:true, exists:false, version:'3'};
  const meta = excelDatabaseMeta_(file);
  if (meta.size > PN_EXCEL_MAX_BYTES) throw new Error('Database Excel pusat melebihi batas 20 MB.');
  meta.ok = true;
  meta.version = '3';
  meta.chunkBytes = PN_EXCEL_CHUNK_BYTES;
  meta.chunkCount = Math.ceil(meta.size / PN_EXCEL_CHUNK_BYTES);
  return meta;
}

function excelDatabaseChunk_(data) {
  requireReviewAdmin_(data.token);
  const file = excelDatabaseCurrentFile_();
  if (!file) return {ok:true, exists:false, version:'3'};

  const index = Math.floor(Number(data.index));
  if (!Number.isFinite(index) || index < 0) throw new Error('Index potongan database tidak valid.');

  const bytes = file.getBlob().getBytes();
  if (bytes.length > PN_EXCEL_MAX_BYTES) throw new Error('Database Excel pusat melebihi batas 20 MB.');
  const chunkCount = Math.ceil(bytes.length / PN_EXCEL_CHUNK_BYTES);
  if (index >= chunkCount) throw new Error('Index potongan database di luar batas.');

  const start = index * PN_EXCEL_CHUNK_BYTES;
  const end = Math.min(start + PN_EXCEL_CHUNK_BYTES, bytes.length);
  const part = bytes.slice(start, end);
  return {
    ok:true,
    exists:true,
    version:'3',
    index:index,
    chunkCount:chunkCount,
    size:bytes.length,
    name:file.getName(),
    updatedAt:Utilities.formatDate(file.getLastUpdated(), 'Asia/Jakarta', "yyyy-MM-dd'T'HH:mm:ss"),
    base64:Utilities.base64Encode(part)
  };
}
'''
          new_manifest = '''function excelDatabaseTicketKey_(ticket) {
  return 'pn-excel-download:' + String(ticket || '');
}

function excelDatabaseCreateTicket_(file) {
  const ticket = adminGenerateSecret_();
  CacheService.getScriptCache().put(excelDatabaseTicketKey_(ticket), file.getId(), 180);
  return ticket;
}

function excelDatabaseManifest_(data) {
  requireReviewAdmin_(data.token);
  const file = excelDatabaseCurrentFile_();
  if (!file) return {ok:true, exists:false, version:'5'};
  const meta = excelDatabaseMeta_(file);
  if (meta.size > PN_EXCEL_MAX_BYTES) throw new Error('Database Excel pusat melebihi batas 20 MB.');
  meta.ok = true;
  meta.version = '5';
  meta.chunkBytes = PN_EXCEL_CHUNK_BYTES;
  meta.chunkCount = Math.ceil(meta.size / PN_EXCEL_CHUNK_BYTES);
  meta.ticket = excelDatabaseCreateTicket_(file);
  return meta;
}

function excelDatabaseChunkForFile_(file, index) {
  if (!file || file.isTrashed()) return {ok:true, exists:false, version:'5'};
  index = Math.floor(Number(index));
  if (!Number.isFinite(index) || index < 0) throw new Error('Index potongan database tidak valid.');
  const bytes = file.getBlob().getBytes();
  if (bytes.length > PN_EXCEL_MAX_BYTES) throw new Error('Database Excel pusat melebihi batas 20 MB.');
  const chunkCount = Math.ceil(bytes.length / PN_EXCEL_CHUNK_BYTES);
  if (index >= chunkCount) throw new Error('Index potongan database di luar batas.');
  const start = index * PN_EXCEL_CHUNK_BYTES;
  const end = Math.min(start + PN_EXCEL_CHUNK_BYTES, bytes.length);
  const part = bytes.slice(start, end);
  return {
    ok:true, exists:true, version:'5', index:index, chunkCount:chunkCount,
    size:bytes.length, name:file.getName(),
    updatedAt:Utilities.formatDate(file.getLastUpdated(), 'Asia/Jakarta', "yyyy-MM-dd'T'HH:mm:ss"),
    base64:Utilities.base64Encode(part)
  };
}

function excelDatabaseChunkByTicket_(data) {
  const ticket = String(data.ticket || '').trim();
  if (!/^[A-Fa-f0-9]{64}$/.test(ticket)) throw new Error('Ticket download database tidak valid.');
  const fileId = CacheService.getScriptCache().get(excelDatabaseTicketKey_(ticket)) || '';
  if (!fileId) throw new Error('Ticket download database sudah kedaluwarsa. Muat ulang database.');
  const file = DriveApp.getFileById(fileId);
  return excelDatabaseChunkForFile_(file, data.index);
}

function excelDatabaseChunk_(data) {
  requireReviewAdmin_(data.token);
  const file = excelDatabaseCurrentFile_();
  return excelDatabaseChunkForFile_(file, data.index);
}
'''
          if old_manifest not in s:
            raise SystemExit('manifest/chunk source not found')
          s = s.replace(old_manifest, new_manifest)

          get_anchor = """  if (action === 'contentResult') {\n    let result;\n    try {\n      result = contentResult_(data);\n    } catch (err) {\n      result = {ok:false, message:String(err && err.message || err)};\n    }\n    result.rid = String(data.rid || '');\n    if (data.callback) return jsonp_(result, data.callback);\n    return json_(result);\n  }\n\n"""
          get_add = get_anchor + """  if (action === 'databaseChunk') {\n    let result;\n    try {\n      result = excelDatabaseChunkByTicket_(data);\n    } catch (err) {\n      result = {ok:false, message:String(err && err.message || err)};\n    }\n    result.rid = String(data.rid || '');\n    if (data.callback) return jsonp_(result, data.callback);\n    return json_(result);\n  }\n\n"""
          if get_anchor not in s:
            raise SystemExit('doGet contentResult anchor not found')
          s = s.replace(get_anchor, get_add, 1)

          old = """    if (action === 'databaseManifest') {\n      result = excelDatabaseManifest_(data);\n      result.rid = String(data.rid || '');\n      return iframeResult_(result, 'pn-database');\n    }\n"""
          new = """    if (action === 'databaseManifest') {\n      result = excelDatabaseManifest_(data);\n      result.rid = String(data.rid || '');\n      contentRememberResult_(data.rid, result);\n      return iframeResult_(result, 'pn-database');\n    }\n"""
          if old not in s: raise SystemExit('databaseManifest doPost anchor not found')
          s=s.replace(old,new,1)

          old = """    if (action === 'databaseSave') {\n      result = excelDatabaseSave_(data);\n      result.rid = String(data.rid || '');\n      return iframeResult_(result, 'pn-database');\n    }\n"""
          new = """    if (action === 'databaseSave') {\n      result = excelDatabaseSave_(data);\n      result.rid = String(data.rid || '');\n      contentRememberResult_(data.rid, result);\n      return iframeResult_(result, 'pn-database');\n    }\n"""
          if old not in s: raise SystemExit('databaseSave doPost anchor not found')
          s=s.replace(old,new,1)

          old = """    if (['databaseManifest','databaseChunk','databaseGet','databaseSave'].includes(action)) {\n      return iframeResult_(result, 'pn-database');\n    }\n"""
          new = """    if (['databaseManifest','databaseChunk','databaseGet','databaseSave'].includes(action)) {\n      if (['databaseManifest','databaseSave'].includes(action)) contentRememberResult_(data.rid, result);\n      return iframeResult_(result, 'pn-database');\n    }\n"""
          if old not in s: raise SystemExit('database catch anchor not found')
          s=s.replace(old,new,1)
          backend.write_text(s)

          js = Path('js/database-cloud-v1.js')
          j = js.read_text()
          marker = "function pnDatabasePost(action,payload={},timeoutMs=90000){"
          helper = '''function pnDatabaseJsonp(action,payload={},timeoutMs=20000){
  return new Promise((resolve,reject)=>{
    const cb='pnDbJsonp_'+Date.now()+'_'+Math.random().toString(36).slice(2).replace(/\\W/g,'');
    const script=document.createElement('script');
    let done=false;
    const cleanup=()=>{clearTimeout(timer);try{delete window[cb]}catch(_){};script.remove()};
    window[cb]=data=>{if(done)return;done=true;cleanup();if(data&&data.ok)resolve(data);else{const err=new Error(data?.message||'Database pusat menolak permintaan.');err.data=data||{};reject(err)}};
    const q=new URLSearchParams({action,callback:cb,_ts:String(Date.now())});
    Object.entries(payload).forEach(([k,v])=>q.set(k,String(v??'')));
    script.src=PN_DB_ENDPOINT+'?'+q.toString();script.async=true;
    script.onerror=()=>{if(done)return;done=true;cleanup();reject(new Error('Koneksi database pusat gagal.'))};
    const timer=setTimeout(()=>{if(done)return;done=true;cleanup();reject(new Error('Database pusat terlalu lama merespons.'))},timeoutMs);
    document.head.appendChild(script);
  });
}

'''
          if helper.strip() not in j:
            if marker not in j: raise SystemExit('pnDatabasePost marker not found')
            j=j.replace(marker,helper+marker,1)

          old = """    let done=false;\n    const cleanup=()=>{\n      clearTimeout(timer);\n"""
          new = """    let done=false;\n    let pollTimer=0;\n    const cleanup=()=>{\n      clearTimeout(timer);\n      if(pollTimer)clearTimeout(pollTimer);\n"""
          if old not in j: raise SystemExit('databasePost cleanup anchor not found')
          j=j.replace(old,new,1)

          old = """    window.addEventListener('message',onMessage);\n    const timer=setTimeout(()=>finish(false,{message:'Database pusat terlalu lama merespons.'}),timeoutMs);\n    document.body.appendChild(frame);\n    document.body.appendChild(form);\n    form.submit();\n  });\n}\n"""
          new = """    window.addEventListener('message',onMessage);\n    const timer=setTimeout(()=>finish(false,{message:'Database pusat terlalu lama merespons.'}),timeoutMs);\n    const poll=async()=>{\n      if(done)return;\n      try{\n        const r=await pnDatabaseJsonp('contentResult',{rid},7000);\n        if(done)return;\n        if(r&&r.pending){pollTimer=setTimeout(poll,700);return}\n        finish(!!(r&&r.ok),r);\n      }catch(_){if(!done)pollTimer=setTimeout(poll,900)}\n    };\n    document.body.appendChild(frame);\n    document.body.appendChild(form);\n    form.submit();\n    if(action==='databaseManifest'||action==='databaseSave')pollTimer=setTimeout(poll,900);\n  });\n}\n"""
          if old not in j: raise SystemExit('databasePost tail not found')
          j=j.replace(old,new,1)

          old = """  if(!manifest.exists)return {exists:false};\n  const count=Number(manifest.chunkCount||0);\n"""
          new = """  if(!manifest.exists)return {exists:false};\n  if(!/^[A-Fa-f0-9]{64}$/.test(String(manifest.ticket||'')))throw new Error('Ticket database cloud tidak tersedia.');\n  const count=Number(manifest.chunkCount||0);\n"""
          if old not in j: raise SystemExit('manifest validation anchor not found')
          j=j.replace(old,new,1)

          old = """      const r=await pnDatabasePost('databaseChunk',{token,index},45000);\n      if(!r.exists||Number(r.index)!==index||!r.base64)throw new Error('Potongan database cloud '+(index+1)+' tidak valid.');\n"""
          new = """      const r=await pnDatabaseJsonp('databaseChunk',{ticket:manifest.ticket,index},45000);\n      if(!r.exists||Number(r.index)!==index||!r.base64)throw new Error('Potongan database cloud '+(index+1)+' tidak valid.');\n"""
          if old not in j: raise SystemExit('chunk call anchor not found')
          j=j.replace(old,new,1)
          js.write_text(j)

          idx=Path('index.html')
          h=idx.read_text()
          if 'js/database-cloud-v1.js?v=4' not in h: raise SystemExit('loader v4 not found')
          idx.write_text(h.replace('js/database-cloud-v1.js?v=4','js/database-cloud-v1.js?v=5',1))
      - name: Remove temporary installer
        run: rm -f .github/workflows/excel-cloud-reliable-v5-temp.yml
      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/Code.gs js/database-cloud-v1.js index.html .github/workflows/excel-cloud-reliable-v5-temp.yml
          git commit -m "Pasang transport Excel Cloud V5 yang tahan timeout"
          git push
