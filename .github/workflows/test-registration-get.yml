name: Test registration GET

on:
  push:
    paths:
      - '.github/workflows/test-registration-get.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: GET test registration to Apps Script
        shell: bash
        run: |
          set -x
          curl -L -i -sS --get \
            --data-urlencode 'action=register' \
            --data-urlencode 'rid=cek-20260815-0909' \
            --data-urlencode 'name=CEK SISTEM 0909' \
            --data-urlencode 'place=Tulungagung' \
            --data-urlencode 'date=2008-01-01' \
            --data-urlencode 'kelas=X' \
            --data-urlencode 'major=TKJ' \
            --data-urlencode 'address=Tes sistem pendaftaran' \
            --data-urlencode 'parent=Orang Tua Tes' \
            --data-urlencode 'wa=081299990909' \
            --data-urlencode 'email=cek0909@example.com' \
            --data-urlencode 'willing=true' \
            'https://script.google.com/macros/s/AKfycbyJi_83IJ11JshOLCzIBRMX6fEi-y9UGR9eYULuqH1BivdxeqcgMB0I2ehWBlgaad8Oyw/exec'
