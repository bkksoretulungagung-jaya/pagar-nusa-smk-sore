name: Install admin auth v5

on:
  push:
    branches: [main]
    paths:
      - 'js/admin-auth-v5.js'
      - 'tools/install_admin_auth_v5.py'
      - '.github/workflows/install-admin-auth-v5.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install admin auth v5
        run: python tools/install_admin_auth_v5.py
      - name: Commit installation
        run: |
          if git diff --quiet -- index.html; then
            echo 'No index change needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Pasang autentikasi admin v5'
          git push
