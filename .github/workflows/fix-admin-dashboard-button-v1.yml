name: Fix admin dashboard button

on:
  push:
    paths:
      - '.github/workflows/fix-admin-dashboard-button-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fix Dashboard button from admin/database area
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = 'onclick="showPublicDashboard()">← DASHBOARD</button>'
          new = 'onclick="showPublicDashboard(true)">← DASHBOARD</button>'
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit('Dashboard button marker not found')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit dashboard fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Perbaiki tombol Dashboard dari area admin database"
            git push
          fi
