name: Install registration toggle v1

on:
  push:
    branches: [main]
    paths:
      - 'js/registration-toggle-v1.js'
      - 'tools/install_registration_toggle_v1.py'
      - '.github/workflows/install-registration-toggle-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install registration toggle
        run: python tools/install_registration_toggle_v1.py
      - name: Commit installation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html js/content-manager-v1.js
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Pasang saklar ON OFF pendaftaran calon anggota"
            git push
          fi
