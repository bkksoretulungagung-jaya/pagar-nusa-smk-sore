name: Patch Daily Backup V1

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/patch-daily-backup-v1.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch backup otomatis
        run: python3 tools/patch_daily_backup_v1.py

      - name: Verify patch
        run: |
          grep -q "PN_BACKUP_FOLDER_PROPERTY" backend/Code.gs
          grep -q "backupAutomatic:true" backend/Code.gs
          grep -q "function runDailyDatabaseBackup()" backend/Code.gs
          grep -q "function installDailyBackupTrigger()" backend/Code.gs
          grep -q "inTimezone('Asia/Jakarta')" backend/Code.gs

      - name: Commit hasil patch
        run: |
          git config user.name "OpenAI"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/patch-daily-backup-v1.yml
          git rm -f tools/patch_daily_backup_v1.py
          git add backend/Code.gs
          git commit -m "Tambahkan backup database otomatis harian"
          git push origin HEAD:main
