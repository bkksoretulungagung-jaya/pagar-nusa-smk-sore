name: Sync biodata Aspel backend v1

on:
  push:
    branches: [main]
    paths:
      - 'tools/sync_biodata_aspel_backend_v1.py'
      - '.github/workflows/sync-biodata-aspel-backend-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sinkronkan backend dan tampilan biodata Aspel
        run: python tools/sync_biodata_aspel_backend_v1.py
      - name: Commit hasil sinkronisasi
        run: |
          if git diff --quiet -- backend/Code.gs biodata.html js/dashboard-shortcuts-v1.js index.html; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/Code.gs biodata.html js/dashboard-shortcuts-v1.js index.html
          git commit -m "Tampilkan data Aspel pada Portal Biodata v8"
          git push
