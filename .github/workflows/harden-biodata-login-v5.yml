name: Harden biodata login v5

on:
  push:
    paths:
      - '.github/workflows/harden-biodata-login-v5.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make biodata login deterministic
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('biodata.html')
          s=p.read_text(encoding='utf-8')

          old_load="async function loadBio(){const token=await user.getIdToken(true);const r=await request('biodataGet',{username:currentUsername,memberId:currentMemberId,idToken:token});render(r.biodata);$('studentName').textContent=r.biodata?.name||'Siswa / Anggota';$('studentIdentity').textContent=(r.account?.memberId||currentMemberId)+' · '+(r.account?.email||user.email||'');$('loginView').classList.add('hidden');$('portalView').classList.remove('hidden')}"
          new_load="async function loadBio(loginUsername=currentUsername,loginMemberId=currentMemberId,loginUser=user){if(!loginUser)throw new Error('Sesi Firebase belum tersedia.');const token=await loginUser.getIdToken(true);if(!loginUsername||!loginMemberId||!token)throw new Error('Data login lokal belum lengkap.');const r=await request('biodataGet',{username:loginUsername,memberId:loginMemberId,idToken:token});currentUsername=loginUsername;currentMemberId=loginMemberId;user=loginUser;render(r.biodata);$('studentName').textContent=r.biodata?.name||'Siswa / Anggota';$('studentIdentity').textContent=(r.account?.memberId||loginMemberId)+' · '+(r.account?.email||loginUser.email||'');$('loginView').classList.add('hidden');$('portalView').classList.remove('hidden')}"
          if old_load not in s:
              raise SystemExit('loadBio target not found')
          s=s.replace(old_load,new_load,1)

          old_submit="$('loginForm').addEventListener('submit',async e=>{e.preventDefault();$('loginError').textContent='';if(!endpointReady()){ $('loginError').textContent='Web App biodata belum diaktifkan.';return}currentUsername=$('username').value.trim();currentMemberId=$('memberId').value.trim();if(!currentUsername||!currentMemberId)return;sessionStorage.setItem('pnBioUsername',currentUsername);sessionStorage.setItem('pnBioMemberId',currentMemberId);loginInFlight=true;try{$('loginBtn').disabled=true;const cred=await signInWithEmailAndPassword(auth,$('email').value.trim(),$('password').value);user=cred.user;await loadBio()}catch(err){sessionStorage.removeItem('pnBioUsername');sessionStorage.removeItem('pnBioMemberId');$('loginError').textContent=loginErrorText(err);try{await signOut(auth)}catch(_){}}finally{loginInFlight=false;$('loginBtn').disabled=false}});"
          new_submit="$('loginForm').addEventListener('submit',async e=>{e.preventDefault();$('loginError').textContent='';if(!endpointReady()){ $('loginError').textContent='Web App biodata belum diaktifkan.';return}const loginUsername=$('username').value.trim();const loginMemberId=$('memberId').value.trim();const loginEmail=$('email').value.trim();if(!loginUsername||!loginMemberId||!loginEmail){$('loginError').textContent='Username, ID Anggota, dan email wajib diisi.';return}loginInFlight=true;try{$('loginBtn').disabled=true;const cred=await signInWithEmailAndPassword(auth,loginEmail,$('password').value);await loadBio(loginUsername,loginMemberId,cred.user);sessionStorage.setItem('pnBioUsername',loginUsername);sessionStorage.setItem('pnBioMemberId',loginMemberId)}catch(err){sessionStorage.removeItem('pnBioUsername');sessionStorage.removeItem('pnBioMemberId');$('loginError').textContent=loginErrorText(err);try{await signOut(auth)}catch(_){}}finally{loginInFlight=false;$('loginBtn').disabled=false}});"
          if old_submit not in s:
              raise SystemExit('submit target not found')
          s=s.replace(old_submit,new_submit,1)

          old_auth="onAuthStateChanged(auth,async u=>{if(!u){user=null;$('portalView').classList.add('hidden');$('loginView').classList.remove('hidden');return}user=u;if(loginInFlight)return;currentUsername=sessionStorage.getItem('pnBioUsername')||currentUsername||'';currentMemberId=sessionStorage.getItem('pnBioMemberId')||currentMemberId||'';if(currentUsername&&currentMemberId&&endpointReady()){try{await loadBio()}catch(e){$('loginError').textContent=e.message||'Verifikasi biodata gagal.';await signOut(auth)}}});"
          new_auth="onAuthStateChanged(auth,async u=>{if(!u){user=null;$('portalView').classList.add('hidden');$('loginView').classList.remove('hidden');return}if(loginInFlight)return;sessionStorage.removeItem('pnBioUsername');sessionStorage.removeItem('pnBioMemberId');currentUsername='';currentMemberId='';user=null;try{await signOut(auth)}catch(_){}});"
          if old_auth not in s:
              raise SystemExit('auth target not found')
          s=s.replace(old_auth,new_auth,1)

          s=s.replace("Portal Biodata aktif. Silakan login menggunakan akun masing-masing.","Portal Biodata aktif · versi 5. Silakan login menggunakan akun masing-masing.",1)
          p.write_text(s,encoding='utf-8')

          u=Path('js/ui-v9.js')
          x=u.read_text(encoding='utf-8')
          x=x.replace("bio.href='biodata.html?v=4';","bio.href='biodata.html?v=5';")
          u.write_text(x,encoding='utf-8')

          i=Path('index.html')
          y=i.read_text(encoding='utf-8')
          y=y.replace('js/ui-v9.js?v=43','js/ui-v9.js?v=44')
          i.write_text(y,encoding='utf-8')
          PY
      - name: Commit fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add biodata.html js/ui-v9.js index.html
          if git diff --cached --quiet; then
            echo 'No change needed.'
            exit 0
          fi
          git commit -m 'Harden Portal Biodata login flow v5'
          git push
