name: Add WhatsApp contact

on:
  push:
    paths:
      - '.github/workflows/add-whatsapp-contact.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add WhatsApp contact with logo
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          if 'wa.me/6285736062138' in s:
              raise SystemExit(0)
          marker = '      <a class="siteContactLink" href="mailto:pagarnusasmksore86@gmail.com" aria-label="Email pagarnusasmksore86@gmail.com">'
          if marker not in s:
              raise SystemExit('Email contact marker not found')
          lines = [
              '      <a class="siteContactLink" href="https://wa.me/6285736062138" target="_blank" rel="noopener noreferrer" aria-label="WhatsApp 085736062138">',
              '        <svg class="siteContactIcon" viewBox="0 0 24 24" aria-hidden="true">',
              '          <path fill="#25D366" d="M12 2a9.5 9.5 0 0 0-8.23 14.25L2.5 21.5l5.38-1.41A9.5 9.5 0 1 0 12 2Z"/>',
              '          <path fill="#fff" d="M17.47 14.38c-.3-.15-1.76-.87-2.03-.97-.27-.1-.47-.15-.67.15-.2.3-.77.97-.94 1.17-.17.2-.35.22-.65.07-.3-.15-1.26-.46-2.4-1.48-.89-.79-1.49-1.77-1.66-2.07-.17-.3-.02-.46.13-.61.13-.13.3-.35.45-.52.15-.17.2-.3.3-.5.1-.2.05-.37-.02-.52-.08-.15-.67-1.61-.92-2.21-.24-.58-.49-.5-.67-.51h-.57c-.2 0-.52.07-.79.37-.27.3-1.04 1.02-1.04 2.48s1.07 2.87 1.22 3.07c.15.2 2.1 3.2 5.08 4.49.71.31 1.26.49 1.69.63.71.23 1.36.19 1.87.12.57-.08 1.76-.72 2.01-1.41.25-.7.25-1.29.17-1.41-.07-.13-.27-.2-.57-.35Z"/>',
              '        </svg>',
              '        <span>WhatsApp: 085736062138</span>',
              '      </a>',
          ]
          whatsapp = '\n'.join(lines) + '\n'
          email_end = '      </a>\n    </div>'
          email_pos = s.find(marker)
          end_pos = s.find(email_end, email_pos)
          if end_pos == -1:
              raise SystemExit('Email closing marker not found')
          insert_pos = end_pos + len('      </a>\n')
          s = s[:insert_pos] + whatsapp + s[insert_pos:]
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit WhatsApp contact
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Tambahkan kontak WhatsApp dengan logo WhatsApp'
          git push
