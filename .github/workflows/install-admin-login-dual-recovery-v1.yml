name: Install admin dual login recovery v1
on:
  push:
    paths:
      - '.github/workflows/install-admin-login-dual-recovery-v1.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dual login recovery
        run: python tools/install_admin_login_dual_recovery_v1.py
      - name: Commit installation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Pasang login admin dua jalur v1"
          git push
