name: Standardize portal member terms v1
on:
  push:
    paths:
      - 'tools/standardize_portal_member_terms_v1.py'
      - '.github/workflows/standardize-portal-member-terms-v1.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Standardize portal labels
        run: python3 tools/standardize_portal_member_terms_v1.py
      - name: Commit portal terminology
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add biodata.html siswa.html js/biodata-portal-v1.js js/dashboard-shortcuts-v1.js index.html
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Seragamkan istilah portal menjadi Anggota"
            git push
          fi
