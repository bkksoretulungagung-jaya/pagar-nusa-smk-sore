name: Run database history V7 installer once
on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/run-database-history-v7-temp.yml'
permissions:
  contents: write
jobs:
  install-history-v7:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/database-history-v7
      - name: Patch V7 files
        run: python tools/install_database_history_v7.py
      - name: Remove installer source
        run: rm -f tools/install_database_history_v7.py
      - name: Commit V7 generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/Code.gs js/database-cloud-v1.js index.html tools/install_database_history_v7.py
          git commit -m "Tambah riwayat perubahan data lintas perangkat"
          git push origin HEAD:agent/database-history-v7
