name: Install admin password save fix v1

on:
  push:
    branches: [main]
    paths:
      - 'js/admin-password-save-fix-v1.js'
      - 'tools/install_admin_password_save_fix_v1.py'
      - '.github/workflows/install-admin-password-save-fix-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install password save fix
        run: python tools/install_admin_password_save_fix_v1.py
      - name: Commit installation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Pasang perbaikan simpan password admin"
            git push
          fi
