name: Fix CBT login polling v3

on:
  push:
    branches: [main]
    paths:
      - 'tools/fix_cbt_login_polling_v3.py'
      - '.github/workflows/fix-cbt-login-polling-v3.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install CBT login polling fix
        run: python tools/fix_cbt_login_polling_v3.py
      - name: Commit installation
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "418982+github-actions[bot]@users.noreply.github.com"
          git add backend/Code.gs siswa.html
          git commit -m "Percepat login CBT dengan polling RID"
          git push
