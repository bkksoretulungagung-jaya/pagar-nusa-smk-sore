name: Install admin password safe v3

on:
  push:
    branches: [main]
    paths:
      - 'tools/install_admin_password_safe_v3.py'
      - 'js/admin-password-safe-v3.js'
      - '.github/workflows/install-admin-password-safe-v3.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install safe admin password v3
        run: python tools/install_admin_password_safe_v3.py
      - name: Commit installation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html backend/Code.gs
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Pasang ganti password admin aman v3"
            git push
          fi
