name: Activate admin session keepalive

on:
  push:
    paths:
      - '.github/workflows/activate-admin-session-keepalive-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Load admin session keepalive
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="js/admin-session-keepalive-v1.js?v=1"></script>'
          if tag not in s:
              markers=[
                  '<script src="js/reviews-admin-session-v10.js?v=14"></script>',
                  '<script src="js/content-manager-v1.js?v=10"></script>',
                  '<script src="js/admin-notifications-v1.js?v=1"></script>'
              ]
              for marker in markers:
                  if marker in s:
                      s=s.replace(marker,marker+'\n'+tag,1)
                      break
              else:
                  raise SystemExit('admin keepalive insertion marker not found')
          p.write_text(s,encoding='utf-8')
          PY

      - name: Commit keepalive activation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Aktifkan keepalive sesi admin sampai logout"
            git push
          fi
