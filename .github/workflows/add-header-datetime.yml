name: Simplify header date time

on:
  push:
    paths:
      - '.github/workflows/add-header-datetime.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove date time box
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old = '.siteDateTime{position:absolute;top:8px;right:12px;z-index:30;min-width:170px;padding:7px 10px;text-align:right;color:#fff;background:rgba(0,0,0,.18);border:1px solid rgba(255,255,255,.22);border-radius:9px;box-shadow:0 3px 10px rgba(0,0,0,.14);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);pointer-events:none;font-variant-numeric:tabular-nums}'
          new = '.siteDateTime{position:absolute;top:8px;right:12px;z-index:30;min-width:0;padding:0;text-align:right;color:#fff;background:transparent;border:0;border-radius:0;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none;pointer-events:none;font-variant-numeric:tabular-nums}'
          s = s.replace(old, new)

          old_mobile = '@media(max-width:680px){.topBar{padding-top:42px!important}.siteDateTime{top:7px;right:8px;min-width:150px;padding:6px 8px}.siteDateText{font-size:8px}.siteHijriText{font-size:8px}.siteTimeText{font-size:11px}}'
          new_mobile = '@media(max-width:680px){.topBar{padding-top:42px!important}.siteDateTime{top:7px;right:8px;min-width:0;padding:0;background:transparent;border:0;border-radius:0;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none}.siteDateText{font-size:8px}.siteHijriText{font-size:8px}.siteTimeText{font-size:11px}}'
          s = s.replace(old_mobile, new_mobile)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit header date time simplification
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Hilangkan kotak tanggal dan jam di header'
          git push
