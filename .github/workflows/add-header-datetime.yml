name: Resize header date time

on:
  push:
    paths:
      - '.github/workflows/add-header-datetime.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make header date time smaller
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('.siteDateText{font-size:11px;font-weight:800;line-height:1.25;white-space:nowrap;opacity:.96}', '.siteDateText{font-size:9px;font-weight:800;line-height:1.2;white-space:nowrap;opacity:.92}')
          s = s.replace('.siteHijriText{margin-top:2px;font-size:11px;font-weight:800;line-height:1.25;white-space:nowrap;color:#dff7e8}', '.siteHijriText{margin-top:1px;font-size:9px;font-weight:800;line-height:1.2;white-space:nowrap;color:#dff7e8}')
          s = s.replace('.siteTimeText{margin-top:2px;font-size:15px;font-weight:900;line-height:1.15;letter-spacing:.5px;white-space:nowrap}', '.siteTimeText{margin-top:2px;font-size:12px;font-weight:900;line-height:1.15;letter-spacing:.35px;white-space:nowrap}')
          s = s.replace('.siteDateText{font-size:10px}.siteHijriText{font-size:10px}.siteTimeText{font-size:13px}', '.siteDateText{font-size:8px}.siteHijriText{font-size:8px}.siteTimeText{font-size:11px}')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit smaller header date time
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Kecilkan ukuran tanggal dan jam di header'
          git push
