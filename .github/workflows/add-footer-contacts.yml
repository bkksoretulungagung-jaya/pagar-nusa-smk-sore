name: Add website footer contacts

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/add-footer-contacts.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upgrade footer contact icons
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          css = """
/* CONTACT ICONS V30 */
.siteContactLink,.siteContactLocation{display:flex!important;align-items:center;gap:10px}
.siteContactLink{padding:2px 0}
.siteContactIcon{width:22px;height:22px;min-width:22px;display:block;flex:0 0 22px}
.siteContactLink:hover{transform:translateX(2px);transition:transform .18s ease}
.siteContactLocation{justify-content:flex-end}
@media(max-width:680px){.siteContactIcon{width:21px;height:21px;min-width:21px}.siteContactLocation{justify-content:flex-start}}
"""

          if '/* CONTACT ICONS V30 */' not in s:
              s = s.replace('</style>', css + '\n</style>', 1)

          section = '''<section id="siteContacts" class="siteContacts" aria-label="Kontak Pagar Nusa SMK Sore Tulungagung">
  <div class="siteContactsInner">
    <div class="siteContactLeft">
      <h3>KONTAK</h3>
      <a class="siteContactLink" href="https://www.instagram.com/pagarnusa_smksoretulungagung/" target="_blank" rel="noopener noreferrer" aria-label="Instagram pagarnusa_smksoretulungagung">
        <svg class="siteContactIcon" viewBox="0 0 24 24" aria-hidden="true">
          <defs><linearGradient id="igFooterGradient" x1="3" y1="21" x2="21" y2="3" gradientUnits="userSpaceOnUse"><stop stop-color="#FEDA75"/><stop offset=".25" stop-color="#FA7E1E"/><stop offset=".5" stop-color="#D62976"/><stop offset=".75" stop-color="#962FBF"/><stop offset="1" stop-color="#4F5BD5"/></linearGradient></defs>
          <rect x="1.5" y="1.5" width="21" height="21" rx="6" fill="url(#igFooterGradient)"/>
          <rect x="6.1" y="6.1" width="11.8" height="11.8" rx="3.5" fill="none" stroke="#fff" stroke-width="1.8"/>
          <circle cx="12" cy="12" r="2.9" fill="none" stroke="#fff" stroke-width="1.8"/>
          <circle cx="16.5" cy="7.6" r="1" fill="#fff"/>
        </svg>
        <span>Instagram: @pagarnusa_smksoretulungagung</span>
      </a>
      <a class="siteContactLink" href="https://www.tiktok.com/@pagarnusarayonsmksore" target="_blank" rel="noopener noreferrer" aria-label="TikTok pagarnusarayonsmksore">
        <svg class="siteContactIcon" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="11" fill="#090909" stroke="#fff" stroke-opacity=".22"/>
          <path d="M13.05 5.2c.5 1.7 1.55 2.7 3.3 3.05v2.15c-1.3-.05-2.45-.45-3.3-1.1v4.7a4.25 4.25 0 1 1-3.7-4.22v2.18a2.15 2.15 0 1 0 1.55 2.04V5.2h2.15Z" fill="#25F4EE" transform="translate(-.35,.15)"/>
          <path d="M13.05 5.2c.5 1.7 1.55 2.7 3.3 3.05v2.15c-1.3-.05-2.45-.45-3.3-1.1v4.7a4.25 4.25 0 1 1-3.7-4.22v2.18a2.15 2.15 0 1 0 1.55 2.04V5.2h2.15Z" fill="#FE2C55" transform="translate(.35,-.12)"/>
          <path d="M13.05 5.2c.5 1.7 1.55 2.7 3.3 3.05v2.15c-1.3-.05-2.45-.45-3.3-1.1v4.7a4.25 4.25 0 1 1-3.7-4.22v2.18a2.15 2.15 0 1 0 1.55 2.04V5.2h2.15Z" fill="#fff"/>
        </svg>
        <span>TikTok: @pagarnusarayonsmksore</span>
      </a>
      <a class="siteContactLink" href="mailto:pagarnusasmksore86@gmail.com" aria-label="Email pagarnusasmksore86@gmail.com">
        <svg class="siteContactIcon" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="2" y="4" width="20" height="16" rx="3" fill="#fff" opacity=".15"/>
          <path d="M4 7.2 12 13l8-5.8M4 18V6h16v12H4Z" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>Email: pagarnusasmksore86@gmail.com</span>
      </a>
    </div>
    <div class="siteContactRight">
      <h3>SEKRETARIAT</h3>
      <p class="siteContactLocation">
        <svg class="siteContactIcon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22s7-6.15 7-13a7 7 0 1 0-14 0c0 6.85 7 13 7 13Z" fill="#fff" opacity=".18"/><path d="M12 21s6-5.65 6-12a6 6 0 1 0-12 0c0 6.35 6 12 6 12Z" fill="none" stroke="#fff" stroke-width="1.8"/><circle cx="12" cy="9" r="2.2" fill="#fff"/></svg>
        <span>Jln. Mastrip No. 100 Tulungagung</span>
      </p>
    </div>
  </div>
</section>'''

          pattern = r'<section id="siteContacts" class="siteContacts"[\s\S]*?</section>'
          if re.search(pattern, s):
              s = re.sub(pattern, section, s, count=1)
          else:
              marker = '<div class="footer">© 2026 Database Pagar Nusa Rayon SMK Sore Tulungagung</div>'
              if marker not in s:
                  raise SystemExit('Footer marker not found')
              s = s.replace(marker, section + '\n\n' + marker, 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit upgraded contact icons
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Gunakan logo SVG untuk kontak footer'
          git push
