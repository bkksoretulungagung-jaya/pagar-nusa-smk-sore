name: Add website footer contacts

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/add-footer-contacts.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix footer labels
        run: |
          sed -i 's/KONTAKT/KONTAK/g; s/SEKSETARIAP/SEKRETARIAT/g' index.html
      - name: Commit footer label fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Rapikan label kontak dan sekretariat'
          git push
