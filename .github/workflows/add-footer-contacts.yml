name: Add website footer contacts

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/add-footer-contacts.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upgrade footer contact icons
        shell: bash
        run: echo '' | base64 -d | python3
      - name: Commit upgraded contact icons
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Gunakan logo SVG untuk kontak footer'
          git push
