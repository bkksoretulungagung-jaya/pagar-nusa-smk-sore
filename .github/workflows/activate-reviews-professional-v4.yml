name: Activate reviews professional v6
on:
  push:
    paths:
      - 'tools/activate_reviews_professional_v4.py'
      - 'tools/upgrade_reviews_backend_v4.py'
      - 'tools/upgrade_reviews_backend_v6.py'
      - 'tools/activate_reviews_session_v10.py'
      - 'js/reviews-admin-session-v10.js'
      - '.github/workflows/activate-reviews-professional-v4.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch website review controls and cache versions
        run: python tools/activate_reviews_professional_v4.py
      - name: Upgrade review backend source v5 base
        run: python tools/upgrade_reviews_backend_v4.py
      - name: Upgrade moderation session backend v6
        run: python tools/upgrade_reviews_backend_v6.py
      - name: Activate moderation session v10
        run: python tools/activate_reviews_session_v10.py
      - name: Commit professional review system
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html backend/Code.gs js/reviews-moderation-v2.js js/reviews-admin-session-v10.js
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Aktifkan moderasi ulasan stabil v10 backend v6"
            git push
          fi
