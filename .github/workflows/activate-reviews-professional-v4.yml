name: Activate reviews professional v4
on:
  push:
    paths:
      - 'tools/activate_reviews_professional_v4.py'
      - 'tools/upgrade_reviews_backend_v4.py'
      - '.github/workflows/activate-reviews-professional-v4.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch website review controls and cache versions
        run: python tools/activate_reviews_professional_v4.py
      - name: Upgrade review backend source
        run: python tools/upgrade_reviews_backend_v4.py
      - name: Commit professional review system
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html backend/Code.gs js/reviews-moderation-v2.js
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Aktifkan sistem ulasan profesional v5"
            git push
          fi
