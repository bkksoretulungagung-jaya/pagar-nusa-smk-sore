name: Cleanup materi pengurus v3

on:
  push:
    branches: [main]
    paths:
      - 'tools/cleanup_materi_pengurus_v3.py'
      - '.github/workflows/cleanup-materi-pengurus-v3.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove shared access code UI
        run: python tools/cleanup_materi_pengurus_v3.py
      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add materi-pengurus.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Hapus tampilan kode akses lama Materi Pengurus"
            git push
          fi
