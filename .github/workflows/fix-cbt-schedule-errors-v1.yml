name: Fix CBT schedule error routing v1

on:
  push:
    branches: [main]
    paths:
      - 'tools/fix_cbt_schedule_errors_v1.py'
      - '.github/workflows/fix-cbt-schedule-errors-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix CBT schedule error routing
        run: python tools/fix_cbt_schedule_errors_v1.py
      - name: Commit fix
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/Code.gs
          git commit -m "Perbaiki respons error jadwal CBT"
          git push
