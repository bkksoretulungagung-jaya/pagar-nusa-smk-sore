name: Fix content server connection final

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-content-server-connection-final.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch CMS transport only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('js/content-manager-v1.js')
          s = p.read_text(encoding='utf-8')
          replacement = """async function postReliable(action,payload={},timeout=30000){
            const rid=makeRid();
            return new Promise((resolve,reject)=>{
              const frame=document.createElement('iframe');
              frame.name='pnCmsFrame_'+rid.replace(/\\W/g,'');
              frame.style.display='none';
              frame.setAttribute('aria-hidden','true');
              const form=document.createElement('form');
              form.method='POST';form.action=ENDPOINT;form.target=frame.name;form.style.display='none';
              Object.entries({action,rid,...payload}).forEach(([k,v])=>{
                const input=document.createElement('input');input.type='hidden';input.name=k;input.value=String(v??'');form.appendChild(input);
              });
              let done=false;
              let pollTimer=0;
              let hardTimer=0;
              const cleanup=()=>{
                if(pollTimer)clearTimeout(pollTimer);
                if(hardTimer)clearTimeout(hardTimer);
                window.removeEventListener('message',onMessage);
                setTimeout(()=>frame.remove(),120);
              };
              const succeed=data=>{if(done)return;done=true;cleanup();resolve(data)};
              const fail=err=>{if(done)return;done=true;cleanup();reject(err instanceof Error?err:new Error(String(err||'Koneksi server konten gagal.')))};
              const onMessage=e=>{
                const d=e&&e.data;
                if(!d||d.source!==SOURCE||String(d.rid||'')!==rid)return;
                if(d.ok)succeed(d);else fail(new Error(d.message||'Perubahan konten ditolak server.'));
              };
              window.addEventListener('message',onMessage);
              const poll=async()=>{
                if(done)return;
                try{
                  const r=await jsonp('contentResult',{rid},6500);
                  if(done)return;
                  if(r&&r.pending){pollTimer=setTimeout(poll,700);return}
                  if(r&&r.ok){succeed(r);return}
                  if(r&&!r.pending){fail(new Error(r.message||'Perubahan konten ditolak server.'));return}
                }catch(_){
                  if(!done)pollTimer=setTimeout(poll,900);
                }
              };
              hardTimer=setTimeout(()=>fail(new Error('Server konten tidak merespons tepat waktu. Silakan coba sekali lagi.')),timeout);
              document.body.append(frame,form);
              form.submit();
              form.remove();
              pollTimer=setTimeout(poll,1200);
            });
          }"""
          # Hilangkan indentasi tambahan yang hanya dipakai agar YAML valid.
          replacement = '\n'.join(line[10:] if line.startswith('          ') else line for line in replacement.splitlines())
          pattern = r"async function postReliable\(action,payload=\{\},timeout=50000\)\{.*?\n\}\n\nfunction ensureStyles"
          new_s, n = re.subn(pattern, replacement + "\n\nfunction ensureStyles", s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit(f'Gagal menemukan fungsi postReliable lama: {n}')
          p.write_text(new_s, encoding='utf-8')

          idx = Path('index.html')
          t = idx.read_text(encoding='utf-8')
          t2, n2 = re.subn(r'js/content-manager-v1\.js\?v=\d+', 'js/content-manager-v1.js?v=6', t, count=1)
          if n2 != 1:
              raise SystemExit('Tag content-manager-v1.js tidak ditemukan di index.html')
          idx.write_text(t2, encoding='utf-8')
          PY

          node --check js/content-manager-v1.js
          grep -q "window.addEventListener('message',onMessage)" js/content-manager-v1.js
          grep -q "contentResult" js/content-manager-v1.js
          grep -q "content-manager-v1.js?v=6" index.html

          rm -f .github/workflows/fix-content-server-connection-final.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/content-manager-v1.js index.html .github/workflows/fix-content-server-connection-final.yml
          git commit -m 'Perbaiki koneksi server pengelola konten secara final'
          git push
