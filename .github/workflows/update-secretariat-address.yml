name: Center secretariat footer block

on:
  push:
    paths:
      - '.github/workflows/update-secretariat-address.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Center secretariat block on the right
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          s = s.replace(
              '.siteContactRight{text-align:right;max-width:430px}',
              '.siteContactRight{margin-left:auto;width:min(100%,480px);text-align:center;max-width:480px;display:flex;flex-direction:column;align-items:center}'
          )
          s = s.replace(
              '.siteContactLocation{justify-content:flex-end}',
              '.siteContactLocation{justify-content:center;text-align:center;max-width:460px}'
          )
          s = s.replace(
              '@media(max-width:680px){.siteContactsInner{padding:18px 16px;display:block}.siteContactRight{margin-top:18px;text-align:left;max-width:none}.siteContacts a,.siteContacts p{font-size:12px}.siteContacts h3{font-size:13px}}',
              '@media(max-width:680px){.siteContactsInner{padding:18px 16px;display:block}.siteContactRight{margin:18px auto 0;text-align:center;max-width:none;align-items:center}.siteContacts a,.siteContacts p{font-size:12px}.siteContacts h3{font-size:13px}}'
          )
          s = s.replace(
              '@media(max-width:680px){.siteContactIcon{width:21px;height:21px;min-width:21px}.siteContactLocation{justify-content:flex-start}}',
              '@media(max-width:680px){.siteContactIcon{width:21px;height:21px;min-width:21px}.siteContactLocation{justify-content:center;text-align:center}}'
          )

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit footer alignment
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Rapikan posisi sekretariat di footer'
          git push
