name: Update secretariat address

on:
  push:
    paths:
      - '.github/workflows/update-secretariat-address.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update secretariat address
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = 'Jln. Mastrip No. 100 Tulungagung'
          new = 'Jln. Mastrip No. 100, Kabupaten Tulungagung, Jawa Timur 66235'
          if old not in s:
              raise SystemExit('Alamat lama tidak ditemukan')
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY
      - name: Commit address update
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Revisi alamat sekretariat'
          git push
