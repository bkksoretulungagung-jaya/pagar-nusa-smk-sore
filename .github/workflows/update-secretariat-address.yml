name: Align secretariat footer block

on:
  push:
    paths:
      - '.github/workflows/update-secretariat-address.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Align secretariat title and address
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          s = s.replace(
              '.siteContactRight{margin-left:auto;width:min(100%,480px);text-align:center;max-width:480px;display:flex;flex-direction:column;align-items:center}',
              '.siteContactRight{margin-left:auto;width:min(100%,480px);text-align:left;max-width:480px;display:flex;flex-direction:column;align-items:flex-start}'
          )
          s = s.replace(
              '.siteContactLocation{justify-content:center;text-align:center;max-width:460px}',
              '.siteContactLocation{justify-content:flex-start;text-align:left;max-width:460px}'
          )
          s = s.replace(
              '@media(max-width:680px){.siteContactsInner{padding:18px 16px;display:block}.siteContactRight{margin:18px auto 0;text-align:center;max-width:none;align-items:center}.siteContacts a,.siteContacts p{font-size:12px}.siteContacts h3{font-size:13px}}',
              '@media(max-width:680px){.siteContactsInner{padding:18px 16px;display:block}.siteContactRight{margin:18px 0 0 auto;text-align:left;max-width:100%;align-items:flex-start}.siteContacts a,.siteContacts p{font-size:12px}.siteContacts h3{font-size:13px}}'
          )
          s = s.replace(
              '@media(max-width:680px){.siteContactIcon{width:21px;height:21px;min-width:21px}.siteContactLocation{justify-content:center;text-align:center}}',
              '@media(max-width:680px){.siteContactIcon{width:21px;height:21px;min-width:21px}.siteContactLocation{justify-content:flex-start;text-align:left}}'
          )

          # Hapus ikon lokasi agar huruf J pada Jln. tepat sejajar dengan huruf S pada SEKRETARIAT.
          pattern = r'(<p class="siteContactLocation">)\s*<svg class="siteContactIcon"[\s\S]*?</svg>\s*(<span>Jln\. Mastrip No\. 100, Kabupaten Tulungagung, Jawa Timur 66235</span>)'
          s = re.sub(pattern, r'\1\n        \2', s, count=1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit footer alignment
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Sejajarkan SEKRETARIAT dan alamat di sisi kanan'
          git push
