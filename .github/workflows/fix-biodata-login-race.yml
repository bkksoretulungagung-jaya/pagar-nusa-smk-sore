name: Fix biodata login race

on:
  push:
    paths:
      - '.github/workflows/fix-biodata-login-race.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix login race and cache
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('biodata.html')
          s=p.read_text(encoding='utf-8')

          old="let auth,user=null,bio=null,currentUsername='',currentMemberId='';"
          new="let auth,user=null,bio=null,currentUsername='',currentMemberId='',loginInFlight=false;"
          if old not in s:
              raise SystemExit('state line not found')
          s=s.replace(old,new,1)

          old_submit="$('loginForm').addEventListener('submit',async e=>{e.preventDefault();$('loginError').textContent='';if(!endpointReady()){ $('loginError').textContent='Web App biodata belum diaktifkan.';return}currentUsername=$('username').value.trim();currentMemberId=$('memberId').value.trim();if(!currentUsername||!currentMemberId)return;try{$('loginBtn').disabled=true;const cred=await signInWithEmailAndPassword(auth,$('email').value.trim(),$('password').value);user=cred.user;sessionStorage.setItem('pnBioUsername',currentUsername);sessionStorage.setItem('pnBioMemberId',currentMemberId);await loadBio()}catch(err){$('loginError').textContent=loginErrorText(err);try{await signOut(auth)}catch(_){}}finally{$('loginBtn').disabled=false}});"
          new_submit="$('loginForm').addEventListener('submit',async e=>{e.preventDefault();$('loginError').textContent='';if(!endpointReady()){ $('loginError').textContent='Web App biodata belum diaktifkan.';return}currentUsername=$('username').value.trim();currentMemberId=$('memberId').value.trim();if(!currentUsername||!currentMemberId)return;sessionStorage.setItem('pnBioUsername',currentUsername);sessionStorage.setItem('pnBioMemberId',currentMemberId);loginInFlight=true;try{$('loginBtn').disabled=true;const cred=await signInWithEmailAndPassword(auth,$('email').value.trim(),$('password').value);user=cred.user;await loadBio()}catch(err){sessionStorage.removeItem('pnBioUsername');sessionStorage.removeItem('pnBioMemberId');$('loginError').textContent=loginErrorText(err);try{await signOut(auth)}catch(_){}}finally{loginInFlight=false;$('loginBtn').disabled=false}});"
          if old_submit not in s:
              raise SystemExit('submit handler not found')
          s=s.replace(old_submit,new_submit,1)

          old_auth="onAuthStateChanged(auth,async u=>{if(!u){user=null;$('portalView').classList.add('hidden');$('loginView').classList.remove('hidden');return}user=u;currentUsername=sessionStorage.getItem('pnBioUsername')||'';currentMemberId=sessionStorage.getItem('pnBioMemberId')||'';if(currentUsername&&currentMemberId&&endpointReady()){try{await loadBio()}catch(e){$('loginError').textContent=e.message||'Verifikasi biodata gagal.';await signOut(auth)}}});"
          new_auth="onAuthStateChanged(auth,async u=>{if(!u){user=null;$('portalView').classList.add('hidden');$('loginView').classList.remove('hidden');return}user=u;if(loginInFlight)return;currentUsername=sessionStorage.getItem('pnBioUsername')||currentUsername||'';currentMemberId=sessionStorage.getItem('pnBioMemberId')||currentMemberId||'';if(currentUsername&&currentMemberId&&endpointReady()){try{await loadBio()}catch(e){$('loginError').textContent=e.message||'Verifikasi biodata gagal.';await signOut(auth)}}});"
          if old_auth not in s:
              raise SystemExit('auth handler not found')
          s=s.replace(old_auth,new_auth,1)

          old_logout="$('logoutBtn').addEventListener('click',async()=>{sessionStorage.removeItem('pnBioUsername');sessionStorage.removeItem('pnBioMemberId');await signOut(auth)});"
          new_logout="$('logoutBtn').addEventListener('click',async()=>{sessionStorage.removeItem('pnBioUsername');sessionStorage.removeItem('pnBioMemberId');currentUsername='';currentMemberId='';await signOut(auth)});"
          if old_logout in s:
              s=s.replace(old_logout,new_logout,1)

          p.write_text(s,encoding='utf-8')

          u=Path('js/ui-v9.js')
          x=u.read_text(encoding='utf-8')
          x=x.replace("bio.href='biodata.html?v=3';","bio.href='biodata.html?v=4';")
          u.write_text(x,encoding='utf-8')

          i=Path('index.html')
          y=i.read_text(encoding='utf-8')
          y=y.replace('js/ui-v9.js?v=42','js/ui-v9.js?v=43')
          i.write_text(y,encoding='utf-8')
          PY
      - name: Commit fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add biodata.html js/ui-v9.js index.html
          if git diff --cached --quiet; then
            echo 'No change needed.'
            exit 0
          fi
          git commit -m 'Fix biodata login auth race condition'
          git push
