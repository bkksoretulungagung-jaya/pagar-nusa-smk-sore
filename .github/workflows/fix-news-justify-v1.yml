name: Fix database news justify

on:
  push:
    paths:
      - '.github/workflows/fix-news-justify-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fix dynamic news body formatting
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('js/content-manager-v1.js')
          s = p.read_text(encoding='utf-8')

          old_css = ".pnCmsPublicModalBody{padding:20px;color:#334155;font-size:13px;line-height:1.8;white-space:pre-wrap}"
          new_css = ".pnCmsPublicModalBody{padding:20px;color:#334155;font-size:13px;line-height:1.8;white-space:normal;text-align:justify;text-justify:inter-word}.pnCmsPublicModalBody p{margin:0 0 14px;text-align:justify;text-justify:inter-word}.pnCmsPublicModalBody p:last-child{margin-bottom:0}"
          if old_css not in s:
              raise SystemExit('CSS modal berita tidak ditemukan')
          s = s.replace(old_css, new_css, 1)

          old_icon = "function newsIcon(type){const t=String(type||'').toUpperCase();if(t.includes('PENGUMUMAN'))return'📢';if(t.includes('INFORMASI'))return'ℹ️';if(t.includes('PRESTASI'))return'🏆';if(t.includes('ORGANISASI'))return'🏛️';return'📰'}"
          new_icon = old_icon + "\n\nfunction formatPublicBody(value){\n  const text=String(value??'').replace(/\\r\\n?/g,'\\n').trim();\n  if(!text)return '';\n  return text.split(/\\n\\s*\\n/).map(block=>{\n    const clean=block.replace(/\\n+/g,' ').replace(/\\s+/g,' ').trim();\n    return clean?`<p>${esc(clean)}</p>`:'';\n  }).join('');\n}"
          if old_icon not in s:
              raise SystemExit('Fungsi newsIcon tidak ditemukan')
          s = s.replace(old_icon, new_icon, 1)

          old_body = '<div class="pnCmsPublicModalBody">${esc(item.body||item.summary||\'\')}</div>'
          new_body = '<div class="pnCmsPublicModalBody">${formatPublicBody(item.body||item.summary||\'\')}</div>'
          if old_body not in s:
              raise SystemExit('Renderer isi modal berita tidak ditemukan')
          s = s.replace(old_body, new_body, 1)

          p.write_text(s, encoding='utf-8')

          i = Path('index.html')
          html = i.read_text(encoding='utf-8')
          old_tag = '<script src="js/content-manager-v1.js?v=9"></script>'
          new_tag = '<script src="js/content-manager-v1.js?v=10"></script>'
          if old_tag not in html:
              raise SystemExit('Tag cache content-manager v9 tidak ditemukan')
          i.write_text(html.replace(old_tag, new_tag, 1), encoding='utf-8')
          PY

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/content-manager-v1.js index.html
          if ! git diff --cached --quiet; then
            git commit -m "Rapikan rata kanan kiri isi berita dari database"
            git push
          fi
