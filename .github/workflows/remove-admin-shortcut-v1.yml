name: Remove admin shortcut v1
on:
  push:
    paths:
      - 'tools/remove_admin_shortcut_v1.py'
      - '.github/workflows/remove-admin-shortcut-v1.yml'
permissions:
  contents: write
jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove admin shortcut
        run: python tools/remove_admin_shortcut_v1.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html js/dashboard-shortcuts-v1.js
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Hapus Login Admin dari menu pintasan dashboard"
            git push
          fi
